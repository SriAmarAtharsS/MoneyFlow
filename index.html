<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketTrack INR - Mobile Expense Manager</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase 9 Compat Scripts (App & Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbars for app-like clean look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Glassmorphism mobile styles */
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    /* Active press feedback for touch */
    .touch-press:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    /* Smooth slide-up drawer animation */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-full antialiased bg-slate-950 text-slate-100 overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Precise SVG Icon System ---
    const Icon = ({ path, className = "w-5 h-5" }) => (
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        strokeWidth="2" 
        strokeLinecap="round" 
        strokeLinejoin="round" 
        className={`shrink-0 ${className}`}

      </svg>
    );

    const Icons = {
      Home: (props) => <Icon {...props} path={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
      BarChart3: (props) => <Icon {...props} path={<><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/><rect width="4" height="4" x="11" y="13" rx="1"/></>} />,
      Receipt: (props) => <Icon {...props} path={<><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 6v12"/></>} />,
      Settings: (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />,
      Plus: (props) => <Icon {...props} path={<><path d="M12 5v14"/><path d="M5 12h14"/></>} />,
      Rupee: (props) => <Icon {...props} path={<><path d="M6 3h12"/><path d="M6 8h12"/><path d="M6 13h8.5a4.5 4.5 0 0 0 0-9H6"/><path d="M6 13l8.5 8"/></>} />,
      TrendingUp: (props) => <Icon {...props} path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} />,
      ArrowUpRight: (props) => <Icon {...props} path={<><path d="M7 17L17 7"/><path d="M7 7h10v10"/></>} />,
      ArrowDownRight: (props) => <Icon {...props} path={<><path d="M7 7l10 10"/><path d="M17 7v10H7"/></>} />,
      Trash2: (props) => <Icon {...props} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>} />,
      Edit3: (props) => <Icon {...props} path={<><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></>} />,
      Search: (props) => <Icon {...props} path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
      Filter: (props) => <Icon {...props} path={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></>} />,
      Download: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} />,
      X: (props) => <Icon {...props} path={<><path d="M18 6L6 18"/><path d="M6 6l12 12"/></>} />,
      Utensils: (props) => <Icon {...props} path={<><path d="M18 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/></>} />,
      ShoppingBag: (props) => <Icon {...props} path={<><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>} />,
      Car: (props) => <Icon {...props} path={<><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.3.3-1.8.7C4.3 8.6 3 10 3 10s-2.7.6-4.5 1.1C.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></>} />,
      Film: (props) => <Icon {...props} path={<><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></>} />,
      HeartPulse: (props) => <Icon {...props} path={<><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></>} />,
      CreditCard: (props) => <Icon {...props} path={<><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></>} />,
      Zap: (props) => <Icon {...props} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>} />,
      PieChart: (props) => <Icon {...props} path={<><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>} />,
      CheckCircle2: (props) => <Icon {...props} path={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>} />,
      AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />,
      Loader2: (props) => <Icon {...props} path={<><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></>} />
    };

    // --- INR Currency Formatter ---
    const formatINR = (val) => {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(val || 0);
    };

    // --- Preset Mobile Categories & Payment Modes ---
    const CATEGORIES = [
      { id: 'Food', label: 'Food & Dining', icon: Icons.Utensils, color: 'text-amber-400', bg: 'bg-amber-500/10' },
      { id: 'Shopping', label: 'Shopping', icon: Icons.ShoppingBag, color: 'text-pink-400', bg: 'bg-pink-500/10' },
      { id: 'Transport', label: 'Transport', icon: Icons.Car, color: 'text-emerald-400', bg: 'bg-emerald-500/10' },
      { id: 'Bills', label: 'Bills & Utilities', icon: Icons.Zap, color: 'text-blue-400', bg: 'bg-blue-500/10' },
      { id: 'Entertainment', label: 'Entertainment', icon: Icons.Film, color: 'text-purple-400', bg: 'bg-purple-500/10' },
      { id: 'Health', label: 'Health', icon: Icons.HeartPulse, color: 'text-rose-400', bg: 'bg-rose-500/10' },
      { id: 'Others', label: 'Others', icon: Icons.CreditCard, color: 'text-slate-400', bg: 'bg-slate-500/10' }
    ];

    const PAYMENT_METHODS = ['UPI', 'Card', 'Cash', 'Net Banking'];

    // --- Firebase Service (Methodology from index_2.html) ---
    const FirebaseService = {
      db: null,
      unsubscribe: null,

      async init(configJson) {
        try {
          if (!configJson) {
            this.db = null;
            return { success: false, error: 'No configuration provided' };
          }

          let parsedConfig = typeof configJson === 'string' ? JSON.parse(configJson) : configJson;
          
          if (!parsedConfig.apiKey || !parsedConfig.projectId) {
            throw new Error("Invalid config: 'apiKey' and 'projectId' are required.");
          }

          // Reset existing apps to avoid duplicated initialization
          if (window.firebase && firebase.apps.length > 0) {
            await Promise.all(firebase.apps.map(app => app.delete()));
          }

          const app = firebase.initializeApp(parsedConfig);
          this.db = firebase.firestore(app);

          // Test read operation to verify connection & security rules
          const testSnap = await this.db.collection('expenses').limit(1).get();
          
          return {
            success: true,
            projectId: parsedConfig.projectId,
            itemCount: testSnap.size
          };
        } catch (err) {
          console.error("Firebase Init Error:", err);
          this.db = null;
          return {
            success: false,
            error: err.message || 'Failed to initialize Firebase'
          };
        }
      },

      async saveExpense(expense) {
        if (!this.db) throw new Error("Firestore not initialized");
        
        const cleanData = {
          title: expense.title,
          amount: parseFloat(expense.amount),
          type: expense.type || 'expense',
          category: expense.category,
          date: expense.date,
          paymentMethod: expense.paymentMethod || 'UPI',
          note: expense.note || '',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (expense.id && typeof expense.id === 'string' && !expense.id.startsWith('local_')) {
          await this.db.collection('expenses').doc(expense.id).set(cleanData, { merge: true });
          return expense.id;
        } else {
          cleanData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          const docRef = await this.db.collection('expenses').add(cleanData);
          return docRef.id;
        }
      },

      async deleteExpense(id) {
        if (!this.db) throw new Error("Firestore not initialized");
        await this.db.collection('expenses').doc(id).delete();
      }
    };

    // --- Demo Default Data ---
    const INITIAL_TRANSACTIONS = [
      { id: '1', title: 'Monthly Salary', amount: 95000, type: 'income', category: 'Others', date: '2026-10-01', paymentMethod: 'Net Banking', note: 'Tech Corp Salary' },
      { id: '2', title: 'House Rent', amount: 24000, type: 'expense', category: 'Bills', date: '2026-10-02', paymentMethod: 'UPI', note: 'Flat rent payment' },
      { id: '3', title: 'Grocery Supermarket', amount: 3850, type: 'expense', category: 'Food', date: '2026-10-05', paymentMethod: 'UPI', note: 'Weekly groceries' },
      { id: '4', title: 'Electricity & Internet', amount: 2900, type: 'expense', category: 'Bills', date: '2026-10-10', paymentMethod: 'Card', note: 'Wi-Fi + Power' },
      { id: '5', title: 'Freelance Mobile App', amount: 18000, type: 'income', category: 'Others', date: '2026-10-14', paymentMethod: 'Net Banking', note: 'Client milestone' },
      { id: '6', title: 'Movie & Dinner', amount: 2400, type: 'expense', category: 'Entertainment', date: '2026-10-18', paymentMethod: 'UPI', note: 'Weekend outing' },
      { id: '7', title: 'Car Fuel Fill-up', amount: 3200, type: 'expense', category: 'Transport', date: '2026-10-22', paymentMethod: 'Card', note: 'Petrol' },
      { id: '8', title: 'Pharmacy Medicines', amount: 1150, type: 'expense', category: 'Health', date: '2026-10-24', paymentMethod: 'UPI', note: 'Supplements' }
    ];

    function App() {
      // Mobile Navigation Tab State: 'home' | 'analytics' | 'transactions' | 'settings'
      const [activeTab, setActiveTab] = useState('home');
      
      // Data State
      const [transactions, setTransactions] = useState([]);
      const [monthlyBudget, setMonthlyBudget] = useState(() => {
        return Number(localStorage.getItem('pocket_inr_budget')) || 60000;
      });

      // Filter & Search State
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCat, setSelectedCat] = useState('All');
      const [selectedPayment, setSelectedPayment] = useState('All');
      const [analyticsTimeframe, setAnalyticsTimeframe] = useState('Monthly');

      // Modal Drawer States
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);

      // Form Fields
      const [formData, setFormData] = useState({
        title: '',
        amount: '',
        type: 'expense',
        category: 'Food',
        date: new Date().toISOString().split('T')[0],
        paymentMethod: 'UPI',
        note: ''
      });

      // Firebase Config & Sync State
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        return localStorage.getItem('pocket_inr_fb') || '';
      });
      const [fbStatus, setFbStatus] = useState({
        connected: false,
        message: 'Not connected to Cloud Firestore',
        type: 'info',
        projectId: ''
      });
      const [isTestingFb, setIsTestingFb] = useState(false);

      // Chart Ref
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Initialize Firebase Connection Methodology from index_2.html
      useEffect(() => {
        let isMounted = true;

        const setupFirebase = async () => {
          const savedConfigStr = localStorage.getItem('pocket_inr_fb');
          
          if (savedConfigStr) {
            try {
              const res = await FirebaseService.init(savedConfigStr);
              if (isMounted) {
                if (res.success) {
                  setFbStatus({
                    connected: true,
                    message: `Connected to Cloud Firestore`,
                    projectId: res.projectId,
                    type: 'success'
                  });
                  subscribeToFirestore();
                } else {
                  setFbStatus({
                    connected: false,
                    message: `Firestore connection error: ${res.error}`,
                    type: 'error'
                  });
                  loadLocalTransactions();
                }
              }
            } catch (err) {
              if (isMounted) {
                setFbStatus({
                  connected: false,
                  message: `Configuration parse error: ${err.message}`,
                  type: 'error'
                });
                loadLocalTransactions();
              }
            }
          } else {
            if (isMounted) {
              setFbStatus({
                connected: false,
                message: 'Using Local Storage mode. Add Firebase Config in Settings for cloud sync.',
                type: 'info'
              });
              loadLocalTransactions();
            }
          }
        };

        setupFirebase();

        return () => {
          isMounted = false;
          if (FirebaseService.unsubscribe) {
            FirebaseService.unsubscribe();
          }
        };
      }, []);

      // Real-time Firestore Subscriptions
      const subscribeToFirestore = () => {
        if (!FirebaseService.db) return;

        if (FirebaseService.unsubscribe) {
          FirebaseService.unsubscribe();
        }

        FirebaseService.unsubscribe = FirebaseService.db
          .collection('expenses')
          .orderBy('date', 'desc')
          .onSnapshot(
            (snapshot) => {
              const docs = snapshot.docs.map(doc => {
                const data = doc.data();
                return {
                  id: doc.id,
                  ...data,
                  amount: parseFloat(data.amount || 0)
                };
              });
              setTransactions(docs);
              localStorage.setItem('pocket_inr_txs_backup', JSON.stringify(docs));
            },
            (error) => {
              console.error("Firestore snapshot error:", error);
              setFbStatus({
                connected: false,
                message: `Sync Error: ${error.message}`,
                type: 'error'
              });
              loadLocalTransactions();
            }
          );
      };

      // Fallback Local Storage Loader
      const loadLocalTransactions = () => {
        try {
          const saved = localStorage.getItem('pocket_inr_txs');
          const backup = localStorage.getItem('pocket_inr_txs_backup');
          const raw = saved || backup;
          if (raw) {
            setTransactions(JSON.parse(raw));
          } else {
            setTransactions(INITIAL_TRANSACTIONS);
            localStorage.setItem('pocket_inr_txs', JSON.stringify(INITIAL_TRANSACTIONS));
          }
        } catch (e) {
          console.error("Failed to read local transactions:", e);
          setTransactions(INITIAL_TRANSACTIONS);
        }
      };

      // Save local transactions
      const saveLocalTransactions = (updatedList) => {
        setTransactions(updatedList);
        localStorage.setItem('pocket_inr_txs', JSON.stringify(updatedList));
      };

      useEffect(() => {
        localStorage.setItem('pocket_inr_budget', monthlyBudget.toString());
      }, [monthlyBudget]);

      // Calculate Stats
      const totalIncome = useMemo(() => {
        return transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
      }, [transactions]);

      const totalExpense = useMemo(() => {
        return transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);
      }, [transactions]);

      const netBalance = totalIncome - totalExpense;
      const remainingBudget = Math.max(0, monthlyBudget - totalExpense);
      const budgetSpentPercent = Math.min(100, Math.round((totalExpense / (monthlyBudget || 1)) * 100));

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchQuery = searchQuery === '' || 
            t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (t.note && t.note.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchCat = selectedCat === 'All' || t.category === selectedCat;
          const matchPay = selectedPayment === 'All' || t.paymentMethod === selectedPayment;
          return matchQuery && matchCat && matchPay;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery, selectedCat, selectedPayment]);

      // Firebase Config Tester & Verification methodology from index_2.html
      const handleTestAndSaveFirebase = async () => {
        if (!firebaseConfig.trim()) {
          if (FirebaseService.unsubscribe) FirebaseService.unsubscribe();
          FirebaseService.db = null;
          if (window.firebase && firebase.apps.length > 0) {
            await Promise.all(firebase.apps.map(app => app.delete()));
          }
          localStorage.removeItem('pocket_inr_fb');
          setFbStatus({
            connected: false,
            message: 'Firebase configuration cleared. Switched to Local Storage mode.',
            type: 'info'
          });
          loadLocalTransactions();
          return;
        }

        setIsTestingFb(true);
        try {
          let parsed;
          let formattedText = firebaseConfig.trim();
          if (formattedText.startsWith('const firebaseConfig =') || formattedText.startsWith('var firebaseConfig =')) {
            formattedText = formattedText.replace(/^(const|var|let)\s+firebaseConfig\s*=\s*/, '').replace(/;$/, '');
          }
          formattedText = formattedText.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
          
          parsed = JSON.parse(formattedText);

          const res = await FirebaseService.init(parsed);

          if (res.success) {
            localStorage.setItem('pocket_inr_fb', JSON.stringify(parsed));
            setFbStatus({
              connected: true,
              message: `Successfully connected to Cloud Firestore (${res.projectId})`,
              projectId: res.projectId,
              type: 'success'
            });
            subscribeToFirestore();
          } else {
            setFbStatus({
              connected: false,
              message: `Connection Failed: ${res.error}`,
              type: 'error'

          }
        } catch (err) {

          id: editingTx ? editingTx.id : `local_${Date.now()}`,
          title: formData.title.trim(),
          amount: parseFloat(formData.amount),
          type: formData.type,
          category: formData.category,
          date: formData.date,
          paymentMethod: formData.paymentMethod,
          note: formData.note
        };

        if (fbStatus.connected && FirebaseService.db) {
          try {
            await FirebaseService.saveExpense(expensePayload);
          } catch (err) {
            console.error("Firestore Save Error:", err);
            updateLocalStorageWithItem(expensePayload);
          }
        } else {
          updateLocalStorageWithItem(expensePayload);

        setIsAddModalOpen(false);
        setEditingTx(null);
        resetForm();

        let updated;
        if (editingTx) {

        saveLocalTransactions(updated);

          `"${t.title.replace(/"/g, '""')}"`,

          t.type || 'expense', 
          t.category, 
          t.paymentMethod || 'UPI', 
          t.date, 
          `"${(t.note || '').replace(/"/g, '""')}"`

                activeTab === 'settings' ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icons.Settings className="w-5 h-5" />
              <span className="text-[10px]">Sync</span>
            </button>
          </nav>

          {/* Add / Edit Transaction Drawer Modal */}
          {isAddModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end justify-center p-0">
              <div className="w-full max-w-md bg-slate-900 border-t border-slate-800 rounded-t-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto animate-slide-up">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white">
                    {editingTx ? 'Edit Transaction' : 'Add New Transaction'}
                  </h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTransaction} className="space-y-3.5">
                  {/* Type Selector (Expense / Income) */}
                  <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button
                      type="button"
                      onClick={() => setFormData(prev => ({ ...prev, type: 'expense' }))}
                      className={`py-2 text-xs font-bold rounded-lg transition-all ${
                        formData.type === 'expense' ? 'bg-rose-500 text-white' : 'text-slate-400'
                      }`}
                    >
                      Expense
                    </button>
                    <button
                      type="button"
                      onClick={() => setFormData(prev => ({ ...prev, type: 'income' }))}
                      className={`py-2 text-xs font-bold rounded-lg transition-all ${
                        formData.type === 'income' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'
                      }`}
                    >
                      Income
                    </button>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1 uppercase">Title</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Swiggy, Fuel, Salary"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500/50"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1 uppercase">Amount (₹ INR)</label>
                    <input 
                      type="number"
                      step="0.01"
                      required
                      placeholder="0.00"
                      value={formData.amount}
                      onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white font-bold focus:outline-none focus:border-emerald-500/50"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1 uppercase">Category</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2.5 text-xs text-white focus:outline-none"
                      >
                        {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1 uppercase">Payment Method</label>
                      <select
                        value={formData.paymentMethod}
                        onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2.5 text-xs text-white focus:outline-none"
                      >
                        {PAYMENT_METHODS.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1 uppercase">Date</label>
                    <input 
                      type="date"
                      required
                      value={formData.date}
                      onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1 uppercase">Notes (Optional)</label>
                    <textarea 
                      rows="2"
                      placeholder="Add details..."
                      value={formData.note}
                      onChange={(e) => setFormData({ ...formData, note: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition-all shadow-lg shadow-emerald-500/20"
                  >
                    {editingTx ? 'Update Transaction' : 'Save Transaction'}
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
