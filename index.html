<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketTrack INR - Mobile Expense Manager</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbars for app-like clean look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Glassmorphism mobile styles */
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    /* Active press feedback for touch */
    .touch-press:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    /* Smooth slide-up drawer animation */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-full antialiased bg-slate-950 text-slate-100 overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Precise SVG Icon System ---
    const Icon = ({ path, className = "w-5 h-5" }) => (
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        strokeWidth="2" 
        strokeLinecap="round" 
        strokeLinejoin="round" 
        className={`shrink-0 ${className}`}
      >
        {path}
      </svg>
    );

    const Icons = {
      Home: (props) => <Icon {...props} path={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
      BarChart3: (props) => <Icon {...props} path={<><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/><rect width="4" height="4" x="11" y="13" rx="1"/></>} />,
      Receipt: (props) => <Icon {...props} path={<><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 6v12"/></>} />,
      Settings: (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />,
      Plus: (props) => <Icon {...props} path={<><path d="M12 5v14"/><path d="M5 12h14"/></>} />,
      Rupee: (props) => <Icon {...props} path={<><path d="M6 3h12"/><path d="M6 8h12"/><path d="M6 13h8.5a4.5 4.5 0 0 0 0-9H6"/><path d="M6 13l8.5 8"/></>} />,
      TrendingUp: (props) => <Icon {...props} path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} />,
      ArrowUpRight: (props) => <Icon {...props} path={<><path d="M7 17L17 7"/><path d="M7 7h10v10"/></>} />,
      ArrowDownRight: (props) => <Icon {...props} path={<><path d="M7 7l10 10"/><path d="M17 7v10H7"/></>} />,
      Trash2: (props) => <Icon {...props} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>} />,
      Edit3: (props) => <Icon {...props} path={<><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></>} />,
      Search: (props) => <Icon {...props} path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
      Filter: (props) => <Icon {...props} path={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></>} />,
      Download: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} />,
      X: (props) => <Icon {...props} path={<><path d="M18 6L6 18"/><path d="M6 6l12 12"/></>} />,
      Utensils: (props) => <Icon {...props} path={<><path d="M18 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/></>} />,
      ShoppingBag: (props) => <Icon {...props} path={<><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>} />,
      Car: (props) => <Icon {...props} path={<><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.3.3-1.8.7C4.3 8.6 3 10 3 10s-2.7.6-4.5 1.1C.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></>} />,
      Film: (props) => <Icon {...props} path={<><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></>} />,
      HeartPulse: (props) => <Icon {...props} path={<><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></>} />,
      CreditCard: (props) => <Icon {...props} path={<><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></>} />,
      Zap: (props) => <Icon {...props} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>} />,
      PieChart: (props) => <Icon {...props} path={<><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>} />
    };

    // --- INR Currency Formatter ---
    const formatINR = (val) => {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(val || 0);
    };

    // --- Preset Mobile Categories & Payment Modes ---
    const CATEGORIES = [
      { id: 'Food', label: 'Food & Dining', icon: Icons.Utensils, color: 'text-amber-400', bg: 'bg-amber-500/10' },
      { id: 'Shopping', label: 'Shopping', icon: Icons.ShoppingBag, color: 'text-pink-400', bg: 'bg-pink-500/10' },
      { id: 'Transport', label: 'Transport', icon: Icons.Car, color: 'text-emerald-400', bg: 'bg-emerald-500/10' },
      { id: 'Bills', label: 'Bills & Utilities', icon: Icons.Zap, color: 'text-blue-400', bg: 'bg-blue-500/10' },
      { id: 'Entertainment', label: 'Entertainment', icon: Icons.Film, color: 'text-purple-400', bg: 'bg-purple-500/10' },
      { id: 'Health', label: 'Health', icon: Icons.HeartPulse, color: 'text-rose-400', bg: 'bg-rose-500/10' },
      { id: 'Others', label: 'Others', icon: Icons.CreditCard, color: 'text-slate-400', bg: 'bg-slate-500/10' }
    ];

    const PAYMENT_METHODS = ['UPI', 'Card', 'Cash', 'Net Banking'];

    // --- Demo Default Data ---
    const INITIAL_TRANSACTIONS = [
      { id: '1', title: 'Monthly Salary', amount: 95000, type: 'income', category: 'Others', date: '2026-10-01', paymentMethod: 'Net Banking', note: 'Tech Corp Salary' },
      { id: '2', title: 'House Rent', amount: 24000, type: 'expense', category: 'Bills', date: '2026-10-02', paymentMethod: 'UPI', note: 'Flat rent payment' },
      { id: '3', title: 'Grocery Supermarket', amount: 3850, type: 'expense', category: 'Food', date: '2026-10-05', paymentMethod: 'UPI', note: 'Weekly groceries' },
      { id: '4', title: 'Electricity & Internet', amount: 2900, type: 'expense', category: 'Bills', date: '2026-10-10', paymentMethod: 'Card', note: 'Wi-Fi + Power' },
      { id: '5', title: 'Freelance Mobile App', amount: 18000, type: 'income', category: 'Others', date: '2026-10-14', paymentMethod: 'Net Banking', note: 'Client milestone' },
      { id: '6', title: 'Movie & Dinner', amount: 2400, type: 'expense', category: 'Entertainment', date: '2026-10-18', paymentMethod: 'UPI', note: 'Weekend outing' },
      { id: '7', title: 'Car Fuel Fill-up', amount: 3200, type: 'expense', category: 'Transport', date: '2026-10-22', paymentMethod: 'Card', note: 'Petrol' },
      { id: '8', title: 'Pharmacy Medicines', amount: 1150, type: 'expense', category: 'Health', date: '2026-10-24', paymentMethod: 'UPI', note: 'Supplements' }
    ];

    function App() {
      // Mobile Navigation Tab State: 'home' | 'analytics' | 'transactions' | 'settings'
      const [activeTab, setActiveTab] = useState('home');
      
      // Data State
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('pocket_inr_txs');
        return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
      });

      const [monthlyBudget, setMonthlyBudget] = useState(() => {
        return Number(localStorage.getItem('pocket_inr_budget')) || 60000;
      });

      // Filter & Search State
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCat, setSelectedCat] = useState('All');
      const [selectedPayment, setSelectedPayment] = useState('All');
      const [analyticsTimeframe, setAnalyticsTimeframe] = useState('Monthly'); // 'Weekly' | 'Monthly' | 'Yearly'

      // Modal Drawer States
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);

      // Form Fields
      const [formData, setFormData] = useState({
        title: '',
        amount: '',
        type: 'expense',
        category: 'Food',
        date: new Date().toISOString().split('T')[0],
        paymentMethod: 'UPI',
        note: ''
      });

      // Firebase Config State
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        return localStorage.getItem('pocket_inr_fb') || '';
      });
      const [isConnectedToCloud, setIsConnectedToCloud] = useState(false);

      // Chart Ref
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Save transactions locally
      useEffect(() => {
        localStorage.setItem('pocket_inr_txs', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('pocket_inr_budget', monthlyBudget.toString());
      }, [monthlyBudget]);

      // Calculate Stats
      const totalIncome = useMemo(() => {
        return transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
      }, [transactions]);

      const totalExpense = useMemo(() => {
        return transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);
      }, [transactions]);

      const netBalance = totalIncome - totalExpense;
      const remainingBudget = Math.max(0, monthlyBudget - totalExpense);
      const budgetSpentPercent = Math.min(100, Math.round((totalExpense / (monthlyBudget || 1)) * 100));

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchQuery = searchQuery === '' || 
            t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (t.note && t.note.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchCat = selectedCat === 'All' || t.category === selectedCat;
          const matchPay = selectedPayment === 'All' || t.paymentMethod === selectedPayment;
          return matchQuery && matchCat && matchPay;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery, selectedCat, selectedPayment]);

      // Handle Submit Transaction
      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.amount || isNaN(formData.amount)) return;

        const numAmount = parseFloat(formData.amount);

        if (editingTx) {
          setTransactions(prev => prev.map(t => t.id === editingTx.id ? {
            ...t,
            title: formData.title,
            amount: numAmount,
            type: formData.type,
            category: formData.category,
            date: formData.date,
            paymentMethod: formData.paymentMethod,
            note: formData.note
          } : t));
        } else {
          const newTx = {
            id: Date.now().toString(),
            title: formData.title,
            amount: numAmount,
            type: formData.type,
            category: formData.category,
            date: formData.date,
            paymentMethod: formData.paymentMethod,
            note: formData.note
          };
          setTransactions(prev => [newTx, ...prev]);
        }

        setIsAddModalOpen(false);
        setEditingTx(null);
        resetForm();
      };

      const resetForm = () => {
        setFormData({
          title: '',
          amount: '',
          type: 'expense',
          category: 'Food',
          date: new Date().toISOString().split('T')[0],
          paymentMethod: 'UPI',
          note: ''
        });
      };

      const handleEdit = (tx) => {
        setEditingTx(tx);
        setFormData({
          title: tx.title,
          amount: tx.amount.toString(),
          type: tx.type,
          category: tx.category,
          date: tx.date,
          paymentMethod: tx.paymentMethod || 'UPI',
          note: tx.note || ''
        });
        setIsAddModalOpen(true);
      };

      const handleDelete = (id) => {
        setTransactions(prev => prev.filter(t => t.id !== id));
      };

      // Export CSV
      const handleExportCSV = () => {
        const headers = ['ID', 'Title', 'Amount (INR)', 'Type', 'Category', 'Payment Method', 'Date', 'Note'];
        const rows = transactions.map(t => [
          t.id, 
          `"${t.title.replace(/"/g, '""')}"`, 
          t.amount, 
          t.type, 
          t.category, 
          t.paymentMethod || 'UPI', 
          t.date, 
          `"${(t.note || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `INR_Expenses_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Render Chart.js Analytics
      useEffect(() => {
        if (activeTab !== 'analytics' || !chartRef.current) return;
        
        const ctx = chartRef.current.getContext('2d');
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const catTotals = {};
        transactions.filter(t => t.type === 'expense').forEach(t => {
          catTotals[t.category] = (catTotals[t.category] || 0) + Number(t.amount);
        });

        const labels = Object.keys(catTotals);
        const data = Object.values(catTotals);

        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['No Expenses'],
            datasets: [{
              data: data.length ? data : [1],
              backgroundColor: [
                '#f59e0b', '#ec4899', '#10b981', '#3b82f6', 
                '#a855f7', '#f43f5e', '#64748b'
              ],
              borderWidth: 0,
              hoverOffset: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { 
                  color: '#94a3b8', 
                  font: { family: 'Plus Jakarta Sans', size: 12 },
                  padding: 16
                }
              },
              tooltip: {
                callbacks: {
                  label: (context) => ` Spent: ${formatINR(context.raw)}`
                }
              }
            },
            cutout: '72%'
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [transactions, activeTab, analyticsTimeframe]);

      return (
        <div className="h-full w-full max-w-md mx-auto bg-slate-950 flex flex-col relative overflow-hidden border-x border-slate-800/80">
          
          {/* Fixed Mobile Top Header */}
          <header className="glass-header sticky top-0 z-30 px-5 py-4 flex items-center justify-between shrink-0">
            <div className="inline-flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 inline-flex items-center justify-center font-bold shadow-lg shadow-emerald-500/20">
                <Icons.Rupee className="w-5 h-5 stroke-[2.5]" />
              </div>
              <div>
                <h1 className="text-base font-bold text-white leading-none">PocketTrack</h1>
                <div className="inline-flex items-center gap-1.5 mt-0.5">
                  <span className={`w-2 h-2 rounded-full ${isConnectedToCloud ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className="text-[11px] font-medium text-slate-400">
                    {isConnectedToCloud ? 'Firebase Live' : 'Local Storage'}
                  </span>
                </div>
              </div>
            </div>

            <button 
              onClick={handleExportCSV}
              className="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 text-slate-300 active:scale-95 transition-all inline-flex items-center justify-center"
              title="Export CSV Report"
            >
              <Icons.Download className="w-4 h-4" />
            </button>
          </header>

          {/* Swipeable Scrollable Container */}
          <main className="flex-1 overflow-y-auto no-scrollbar px-4 py-5 space-y-5 pb-28">

            {/* TAB 1: HOME / DASHBOARD */}
            {activeTab === 'home' && (
              <div className="space-y-5 animate-slide-up">
                
                {/* Balance & Overview Card */}
                <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950/40 border border-slate-800 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
                  
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Net Balance</p>
                      <h2 className="text-3xl font-extrabold text-white mt-1 tracking-tight">
                        {formatINR(netBalance)}
                      </h2>
                    </div>
                    <div className="px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-bold inline-flex items-center gap-1">
                      <Icons.TrendingUp className="w-3.5 h-3.5" />
                      Active
                    </div>
                  </div>

                  {/* Income vs Expense Pills */}
                  <div className="grid grid-cols-2 gap-3 mt-5 pt-4 border-t border-slate-800/80">
                    <div className="bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
                      <div className="inline-flex items-center gap-1.5 text-xs text-slate-400 mb-0.5">
                        <Icons.ArrowUpRight className="w-3.5 h-3.5 text-emerald-400" />
                        Income
                      </div>
                      <p className="text-sm font-bold text-emerald-400">{formatINR(totalIncome)}</p>
                    </div>

                    <div className="bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
                      <div className="inline-flex items-center gap-1.5 text-xs text-slate-400 mb-0.5">
                        <Icons.ArrowDownRight className="w-3.5 h-3.5 text-rose-400" />
                        Expenses
                      </div>
                      <p className="text-sm font-bold text-rose-400">{formatINR(totalExpense)}</p>
                    </div>
                  </div>
                </div>

                {/* Monthly Budget Progress Card */}
                <div className="glass-card rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-semibold text-slate-300">Monthly Budget</span>
                    <span className="text-slate-400">{formatINR(totalExpense)} / {formatINR(monthlyBudget)}</span>
                  </div>

                  <div className="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-800">
                    <div 
                      className={`h-full rounded-full transition-all duration-500 ${
                        budgetSpentPercent > 90 ? 'bg-rose-500' : budgetSpentPercent > 75 ? 'bg-amber-500' : 'bg-emerald-400'
                      }`}
                      style={{ width: `${budgetSpentPercent}%` }}
                    />
                  </div>

                  <div className="flex justify-between items-center text-[11px] text-slate-400 pt-1">
                    <span>{budgetSpentPercent}% used</span>
                    <span className="font-semibold text-emerald-400">{formatINR(remainingBudget)} left</span>
                  </div>
                </div>

                {/* Quick Transaction Feed */}
                <div className="space-y-3">
                  <div className="flex justify-between items-center px-1">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Recent Transactions</h3>
                    <button 
                      onClick={() => setActiveTab('transactions')}
                      className="text-xs text-emerald-400 font-semibold hover:underline"
                    >
                      View All
                    </button>
                  </div>

                  {filteredTransactions.slice(0, 4).map((tx) => {
                    const catObj = CATEGORIES.find(c => c.id === tx.category) || CATEGORIES[6];
                    const IconComp = catObj.icon;

                    return (
                      <div 
                        key={tx.id} 
                        className="bg-slate-900/60 border border-slate-800/80 p-3.5 rounded-2xl flex items-center justify-between touch-press"
                      >
                        <div className="inline-flex items-center gap-3 min-w-0">
                          <div className={`p-2.5 rounded-2xl ${catObj.bg} ${catObj.color} inline-flex items-center justify-center shrink-0`}>
                            <IconComp className="w-5 h-5" />
                          </div>
                          <div className="min-w-0">
                            <p className="text-xs font-bold text-slate-100 truncate">{tx.title}</p>
                            <p className="text-[11px] text-slate-400 mt-0.5">{tx.category} • {tx.paymentMethod}</p>
                          </div>
                        </div>

                        <div className="text-right shrink-0">
                          <p className={`text-xs font-bold ${tx.type === 'income' ? 'text-emerald-400' : 'text-slate-100'}`}>
                            {tx.type === 'income' ? '+' : '-'}{formatINR(tx.amount)}
                          </p>
                          <p className="text-[10px] text-slate-500 mt-0.5">{tx.date}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>

              </div>
            )}

            {/* TAB 2: ANALYTICS */}
            {activeTab === 'analytics' && (
              <div className="space-y-5 animate-slide-up">
                
                {/* Timeframe Selector */}
                <div className="bg-slate-900/80 p-1 rounded-2xl border border-slate-800 flex">
                  {['Weekly', 'Monthly', 'Yearly'].map((tf) => (
                    <button
                      key={tf}
                      onClick={() => setAnalyticsTimeframe(tf)}
                      className={`flex-1 py-2 text-xs font-semibold rounded-xl transition-all ${
                        analyticsTimeframe === tf 
                          ? 'bg-emerald-500 text-slate-950 shadow-md font-bold' 
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {tf}
                    </button>
                  ))}
                </div>

                {/* Category Doughnut Chart Card */}
                <div className="glass-card p-5 rounded-3xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider inline-flex items-center gap-1.5">
                      <Icons.PieChart className="w-4 h-4 text-emerald-400" />
                      Expense Categories
                    </h3>
                    <span className="text-[10px] text-slate-500">{analyticsTimeframe}</span>
                  </div>

                  <div className="relative h-60 w-full pt-2">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>

                {/* Category Breakup List */}
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-slate-400 px-1 uppercase tracking-wider">Category Summary</h4>
                  {CATEGORIES.map(cat => {
                    const catSpent = transactions
                      .filter(t => t.type === 'expense' && t.category === cat.id)
                      .reduce((sum, t) => sum + Number(t.amount), 0);
                    
                    if (catSpent === 0) return null;
                    const IconComp = cat.icon;

                    return (
                      <div key={cat.id} className="bg-slate-900/60 border border-slate-800/80 p-3 rounded-2xl flex items-center justify-between">
                        <div className="inline-flex items-center gap-3">
                          <div className={`p-2 rounded-xl ${cat.bg} ${cat.color} inline-flex items-center justify-center`}>
                            <IconComp className="w-4 h-4" />
                          </div>
                          <span className="text-xs font-semibold text-slate-200">{cat.label}</span>
                        </div>
                        <span className="text-xs font-bold text-white">{formatINR(catSpent)}</span>
                      </div>
                    );
                  })}
                </div>

              </div>
            )}

            {/* TAB 3: TRANSACTIONS LIST */}
            {activeTab === 'transactions' && (
              <div className="space-y-4 animate-slide-up">
                
                {/* Search & Filter Bar */}
                <div className="space-y-2">
                  <div className="relative">
                    <Icons.Search className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input 
                      type="text"
                      placeholder="Search expenses, notes..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <select
                      value={selectedCat}
                      onChange={(e) => setSelectedCat(e.target.value)}
                      className="bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none"
                    >
                      <option value="All">All Categories</option>
                      {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                    </select>

                    <select
                      value={selectedPayment}
                      onChange={(e) => setSelectedPayment(e.target.value)}
                      className="bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none"
                    >
                      <option value="All">All Payments</option>
                      {PAYMENT_METHODS.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                </div>

                {/* Transactions List */}
                <div className="space-y-2.5">
                  {filteredTransactions.length === 0 ? (
                    <div className="text-center py-12 text-slate-500 text-xs">
                      No matching records found.
                    </div>
                  ) : (
                    filteredTransactions.map(tx => {
                      const catObj = CATEGORIES.find(c => c.id === tx.category) || CATEGORIES[6];
                      const IconComp = catObj.icon;

                      return (
                        <div 
                          key={tx.id} 
                          className="bg-slate-900/60 border border-slate-800/80 p-3.5 rounded-2xl flex items-center justify-between"
                        >
                          <div className="inline-flex items-center gap-3 min-w-0">
                            <div className={`p-2.5 rounded-2xl ${catObj.bg} ${catObj.color} inline-flex items-center justify-center shrink-0`}>
                              <IconComp className="w-5 h-5" />
                            </div>
                            <div className="min-w-0">
                              <p className="text-xs font-bold text-slate-100 truncate">{tx.title}</p>
                              <p className="text-[11px] text-slate-400 mt-0.5">{tx.category} • {tx.paymentMethod}</p>
                            </div>
                          </div>

                          <div className="inline-flex items-center gap-2">
                            <div className="text-right">
                              <p className={`text-xs font-bold ${tx.type === 'income' ? 'text-emerald-400' : 'text-slate-100'}`}>
                                {tx.type === 'income' ? '+' : '-'}{formatINR(tx.amount)}
                              </p>
                              <p className="text-[10px] text-slate-500 mt-0.5">{tx.date}</p>
                            </div>

                            <div className="inline-flex items-center gap-1 pl-1">
                              <button 
                                onClick={() => handleEdit(tx)}
                                className="p-1.5 text-slate-400 hover:text-emerald-400 inline-flex items-center justify-center"
                              >
                                <Icons.Edit3 className="w-3.5 h-3.5" />
                              </button>
                              <button 
                                onClick={() => handleDelete(tx.id)}
                                className="p-1.5 text-slate-400 hover:text-rose-400 inline-flex items-center justify-center"
                              >
                                <Icons.Trash2 className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

              </div>
            )}

            {/* TAB 4: SETTINGS */}
            {activeTab === 'settings' && (
              <div className="space-y-4 animate-slide-up text-xs">
                
                <div className="glass-card p-5 rounded-3xl space-y-4">
                  <h3 className="text-sm font-bold text-white inline-flex items-center gap-2">
                    <Icons.Settings className="w-4 h-4 text-emerald-400" />
                    Budget Preferences
                  </h3>

                  <div>
                    <label className="block text-slate-400 mb-1 font-semibold">Monthly Spending Target (₹)</label>
                    <input 
                      type="number"
                      value={monthlyBudget}
                      onChange={(e) => setMonthlyBudget(Number(e.target.value))}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 font-bold focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                <div className="glass-card p-5 rounded-3xl space-y-4">
                  <h3 className="text-sm font-bold text-white inline-flex items-center gap-2">
                    <Icons.Zap className="w-4 h-4 text-emerald-400" />
                    Firebase Firestore Config
                  </h3>

                  <div>
                    <textarea 
                      rows="3"
                      placeholder='{ "apiKey": "...", "projectId": "..." }'
                      value={firebaseConfig}
                      onChange={(e) => setFirebaseConfig(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-[11px] font-mono text-slate-200 focus:outline-none focus:border-emerald-500"
                    ></textarea>
                    <p className="text-[11px] text-slate-500 mt-1">Leave empty to use automatic offline local storage.</p>
                  </div>

                  <button 
                    onClick={() => {
                      localStorage.setItem('pocket_inr_fb', firebaseConfig);
                      alert('Settings updated successfully!');
                    }}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/20"
                  >
                    Save Config
                  </button>
                </div>

              </div>
            )}

          </main>

          {/* Floating Action Button (FAB) for Adding Expense */}
          <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-40">
            <button
              onClick={() => {
                setEditingTx(null);
                resetForm();
                setIsAddModalOpen(true);
              }}
              className="bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 p-4 rounded-full shadow-2xl shadow-emerald-500/40 touch-press inline-flex items-center justify-center border border-emerald-300/30"
              title="Add New Entry"
            >
              <Icons.Plus className="w-6 h-6 stroke-[3]" />
            </button>
          </div>

          {/* Mobile Bottom Navigation Bar */}
          <nav className="glass-nav fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 px-6 py-2 flex justify-between items-center">
            <button
              onClick={() => setActiveTab('home')}
              className={`flex flex-col items-center gap-1 transition-all ${
                activeTab === 'home' ? 'text-emerald-400 font-bold' : 'text-slate-500'
              }`}
            >
              <Icons.Home className="w-5 h-5" />
              <span className="text-[10px]">Home</span>
            </button>

            <button
              onClick={() => setActiveTab('analytics')}
              className={`flex flex-col items-center gap-1 transition-all ${
                activeTab === 'analytics' ? 'text-emerald-400 font-bold' : 'text-slate-500'
              }`}
            >
              <Icons.BarChart3 className="w-5 h-5" />
              <span className="text-[10px]">Analytics</span>
            </button>

            <button
              onClick={() => setActiveTab('transactions')}
              className={`flex flex-col items-center gap-1 transition-all ${
                activeTab === 'transactions' ? 'text-emerald-400 font-bold' : 'text-slate-500'
              }`}
            >
              <Icons.Receipt className="w-5 h-5" />
              <span className="text-[10px]">Records</span>
            </button>

            <button
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center gap-1 transition-all ${
                activeTab === 'settings' ? 'text-emerald-400 font-bold' : 'text-slate-500'
              }`}
            >
              <Icons.Settings className="w-5 h-5" />
              <span className="text-[10px]">Settings</span>
            </button>
          </nav>

          {/* Modal Popover Drawer: Add / Edit Transaction */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end justify-center p-0 animate-slide-up">
              <div className="bg-slate-900 border-t border-slate-800 w-full max-w-md rounded-t-3xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white">
                    {editingTx ? 'Edit Transaction' : 'New Transaction'}
                  </h3>
                  <button 
                    onClick={() => setIsAddModalOpen(false)}
                    className="p-1.5 text-slate-400 hover:text-white rounded-full inline-flex items-center justify-center"
                  >
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTransaction} className="space-y-3.5 text-xs">
                  
                  {/* Amount Input */}
                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">Amount (₹)</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-base">₹</span>
                      <input 
                        type="number"
                        step="1"
                        required
                        placeholder="0"
                        value={formData.amount}
                        onChange={(e) => setFormData({...formData, amount: e.target.value})}
                        className="w-full bg-slate-800 border border-slate-700/80 rounded-2xl pl-9 pr-4 py-3 text-lg font-bold text-white focus:outline-none focus:border-emerald-500"
                        autoFocus
                      />
                    </div>
                  </div>

                  {/* Title */}
                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">Title / Shop Name</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Swiggy, DMart, Rent"
                      value={formData.title}
                      onChange={(e) => setFormData({...formData, title: e.target.value})}
                      className="w-full bg-slate-800 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  {/* Type Toggle */}
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => setFormData({...formData, type: 'expense'})}
                      className={`py-2 rounded-xl font-bold transition-all ${
                        formData.type === 'expense' ? 'bg-rose-500/20 border border-rose-500/40 text-rose-400' : 'bg-slate-800 text-slate-400'
                      }`}
                    >
                      Expense
                    </button>
                    <button
                      type="button"
                      onClick={() => setFormData({...formData, type: 'income'})}
                      className={`py-2 rounded-xl font-bold transition-all ${
                        formData.type === 'income' ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-400' : 'bg-slate-800 text-slate-400'
                      }`}
                    >
                      Income
                    </button>
                  </div>

                  {/* Category Selection Grid */}
                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">Category</label>
                    <div className="grid grid-cols-4 gap-2">
                      {CATEGORIES.map(cat => {
                        const IconComp = cat.icon;
                        const isSel = formData.category === cat.id;
                        return (
                          <button
                            type="button"
                            key={cat.id}
                            onClick={() => setFormData({...formData, category: cat.id})}
                            className={`p-2 rounded-xl border flex flex-col items-center justify-center gap-1 transition-all ${
                              isSel ? 'border-emerald-500 bg-emerald-500/10 text-emerald-400' : 'border-slate-800 bg-slate-800/40 text-slate-400'
                            }`}
                          >
                            <IconComp className="w-4 h-4" />
                            <span className="text-[9px] truncate w-full text-center">{cat.id}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Payment Method & Date */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 font-semibold mb-1">Payment Method</label>
                      <select
                        value={formData.paymentMethod}
                        onChange={(e) => setFormData({...formData, paymentMethod: e.target.value})}
                        className="w-full bg-slate-800 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none"
                      >
                        {PAYMENT_METHODS.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 font-semibold mb-1">Date</label>
                      <input 
                        type="date"
                        required
                        value={formData.date}
                        onChange={(e) => setFormData({...formData, date: e.target.value})}
                        className="w-full bg-slate-800 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Note */}
                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">Note (Optional)</label>
                    <input 
                      type="text"
                      placeholder="Additional details..."
                      value={formData.note}
                      onChange={(e) => setFormData({...formData, note: e.target.value})}
                      className="w-full bg-slate-800 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-500/20 text-xs transition-all mt-2"
                  >
                    {editingTx ? 'Update Entry' : 'Save Expense'}
                  </button>

                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount on window load
    window.onload = function() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    };
  </script>
</body>
</html>
