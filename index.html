<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Tracker (INR ₹)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase 9 Compat Scripts (App & Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for mobile cleanliness */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        /* Safe Area Padding for mobile screens */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Categories Configuration
        const CATEGORIES = [
            { id: 'food', name: 'Food & Dining', icon: '🍔', color: '#EF4444' },
            { id: 'groceries', name: 'Groceries', icon: '🛒', color: '#10B981' },
            { id: 'transport', name: 'Transport', icon: '🚗', color: '#3B82F6' },
            { id: 'bills', name: 'Bills & Utilities', icon: '💡', color: '#F59E0B' },
            { id: 'shopping', name: 'Shopping', icon: '🛍️', color: '#EC4899' },
            { id: 'entertainment', name: 'Entertainment', icon: '🎬', color: '#8B5CF6' },
            { id: 'health', name: 'Health & Medical', icon: '🩺', color: '#06B6D4' },
            { id: 'education', name: 'Education', icon: '📚', color: '#6366F1' },
            { id: 'investment', name: 'Investment & Savings', icon: '📈', color: '#14B8A6' },
            { id: 'others', name: 'Others', icon: '📦', color: '#6B7280' }
        ];

        // Format Currency in INR (en-IN)
        const formatINR = (amount) => {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                maximumFractionDigits: 2
            }).format(amount || 0);
        };

        // Date Format helper
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-IN', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        };

        // Firebase Global Helper & Service Manager
        const FirebaseService = {
            db: null,
            unsubscribe: null,

            // Clean initialize or re-initialize
            async init(configJson) {
                try {
                    if (!configJson) {
                        this.db = null;
                        return { success: false, error: 'No configuration provided' };
                    }

                    let parsedConfig = typeof configJson === 'string' ? JSON.parse(configJson) : configJson;
                    
                    if (!parsedConfig.apiKey || !parsedConfig.projectId) {
                        throw new Error("Invalid config: 'apiKey' and 'projectId' are required.");
                    }

                    // Clean up existing apps to avoid duplicate app errors or stale instances
                    if (firebase.apps.length > 0) {
                        await Promise.all(firebase.apps.map(app => app.delete()));
                    }

                    const app = firebase.initializeApp(parsedConfig);
                    this.db = firebase.firestore(app);

                    // Test read operation to verify connection & security rules
                    const testSnap = await this.db.collection('expenses').limit(1).get();
                    
                    return {
                        success: true,
                        projectId: parsedConfig.projectId,
                        itemCount: testSnap.size
                    };
                } catch (err) {
                    console.error("Firebase Init Error:", err);
                    this.db = null;
                    return {
                        success: false,
                        error: err.message || 'Failed to initialize Firebase'
                    };
                }
            },

            // Write or update an expense
            async saveExpense(expense) {
                if (!this.db) throw new Error("Firestore not initialized");
                
                const cleanData = {
                    title: expense.title,
                    amount: parseFloat(expense.amount),
                    category: expense.category,
                    date: expense.date,
                    notes: expense.notes || '',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (expense.id && typeof expense.id === 'string' && !expense.id.startsWith('local_')) {
                    await this.db.collection('expenses').doc(expense.id).set(cleanData, { merge: true });
                    return expense.id;
                } else {
                    cleanData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    const docRef = await this.db.collection('expenses').add(cleanData);
                    return docRef.id;
                }
            },

            // Delete an expense
            async deleteExpense(id) {
                if (!this.db) throw new Error("Firestore not initialized");
                await this.db.collection('expenses').doc(id).delete();
            }
        };

        function App() {
            // App state
            const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'transactions', 'analytics', 'settings'
            const [expenses, setExpenses] = useState([]);
            const [loading, setLoading] = useState(true);
            
            // Modal states
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingExpense, setEditingExpense] = useState(null);

            // Firebase states
            const [fbConfigText, setFbConfigText] = useState(() => localStorage.getItem('fb_config') || '');
            const [fbStatus, setFbStatus] = useState({ connected: false, message: 'Not connected to Firestore', type: 'info', projectId: '' });
            const [isTestingFb, setIsTestingFb] = useState(false);

            // Filter & Search states
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [chartTimeframe, setChartTimeframe] = useState('monthly'); // 'weekly', 'monthly', 'yearly'

            // Form state
            const [formData, setFormData] = useState({
                title: '',
                amount: '',
                category: 'food',
                date: new Date().toISOString().split('T')[0],
                notes: ''
            });

            // Notification / Alert Banner
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Initialize Firebase on mount or config update
            useEffect(() => {
                let isMounted = true;

                const setupFirebase = async () => {
                    setLoading(true);
                    const savedConfigStr = localStorage.getItem('fb_config');
                    
                    if (savedConfigStr) {
                        try {
                            const res = await FirebaseService.init(savedConfigStr);
                            if (isMounted) {
                                if (res.success) {
                                    setFbStatus({
                                        connected: true,
                                        message: `Connected to Cloud Firestore`,
                                        projectId: res.projectId,
                                        type: 'success'
                                    });
                                    subscribeToFirestore();
                                } else {
                                    setFbStatus({
                                        connected: false,
                                        message: `Firestore connection error: ${res.error}`,
                                        type: 'error'
                                    });
                                    loadLocalExpenses();
                                }
                            }
                        } catch (err) {
                            if (isMounted) {
                                setFbStatus({
                                    connected: false,
                                    message: `Configuration parse error: ${err.message}`,
                                    type: 'error'
                                });
                                loadLocalExpenses();
                            }
                        }
                    } else {
                        if (isMounted) {
                            setFbStatus({
                                connected: false,
                                message: 'Using Local Storage mode. Add Firebase Config in Settings for cloud sync.',
                                type: 'info'
                            });
                            loadLocalExpenses();
                        }
                    }
                    if (isMounted) setLoading(false);
                };

                setupFirebase();

                return () => {
                    isMounted = false;
                    if (FirebaseService.unsubscribe) {
                        FirebaseService.unsubscribe();
                    }
                };
            }, []);

            // Subscribe to Firestore Realtime Updates
            const subscribeToFirestore = () => {
                if (!FirebaseService.db) return;

                if (FirebaseService.unsubscribe) {
                    FirebaseService.unsubscribe();
                }

                FirebaseService.unsubscribe = FirebaseService.db
                    .collection('expenses')
                    .orderBy('date', 'desc')
                    .onSnapshot(
                        (snapshot) => {
                            const docs = snapshot.docs.map(doc => {
                                const data = doc.data();
                                return {
                                    id: doc.id,
                                    ...data,
                                    amount: parseFloat(data.amount || 0)
                                };
                            });
                            setExpenses(docs);
                            // Also mirror to local storage as backup
                            localStorage.setItem('local_expenses_backup', JSON.stringify(docs));
                            setLoading(false);
                        },
                        (error) => {
                            console.error("Firestore snapshot error:", error);
                            showToast(`Firestore Snapshot Error: ${error.message}`, 'error');
                            setFbStatus({
                                connected: false,
                                message: `Sync Error: ${error.message}`,
                                type: 'error'
                            });
                            loadLocalExpenses();
                            setLoading(false);
                        }
                    );
            };

            // Fallback Local Storage Loader
            const loadLocalExpenses = () => {
                try {
                    const localData = localStorage.getItem('local_expenses');
                    const backupData = localStorage.getItem('local_expenses_backup');
                    const raw = localData || backupData;
                    if (raw) {
                        setExpenses(JSON.parse(raw));
                    } else {
                        setExpenses([]);
                    }
                } catch (e) {
                    console.error("Failed to read local expenses:", e);
                    setExpenses([]);
                }
            };

            // Save Local Expenses helper
            const saveLocalExpenses = (updatedList) => {
                setExpenses(updatedList);
                localStorage.setItem('local_expenses', JSON.stringify(updatedList));
            };

            // Test and Save Firebase Config
            const handleTestAndSaveFirebase = async () => {
                if (!fbConfigText.trim()) {
                    // Reset Firebase configuration
                    if (FirebaseService.unsubscribe) FirebaseService.unsubscribe();
                    FirebaseService.db = null;
                    if (firebase.apps.length > 0) {
                        await Promise.all(firebase.apps.map(app => app.delete()));
                    }
                    localStorage.removeItem('fb_config');
                    setFbStatus({
                        connected: false,
                        message: 'Firebase configuration cleared. Switched to Local Storage mode.',
                        type: 'info'
                    });
                    showToast('Cleared Firebase configuration', 'info');
                    loadLocalExpenses();
                    return;
                }

                setIsTestingFb(true);
                try {
                    let parsed;
                    // Support both JSON string and copy-pasted JS object strings
                    let formattedText = fbConfigText.trim();
                    if (formattedText.startsWith('const firebaseConfig =') || formattedText.startsWith('var firebaseConfig =')) {
                        formattedText = formattedText.replace(/^(const|var|let)\s+firebaseConfig\s*=\s*/, '').replace(/;$/, '');
                    }
                    // Fix unquoted keys if necessary
                    formattedText = formattedText.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
                    
                    parsed = JSON.parse(formattedText);

                    const res = await FirebaseService.init(parsed);

                    if (res.success) {
                        localStorage.setItem('fb_config', JSON.stringify(parsed));
                        setFbStatus({
                            connected: true,
                            message: `Successfully connected to Cloud Firestore (${res.projectId})`,
                            projectId: res.projectId,
                            type: 'success'
                        });
                        showToast(`Connected to Cloud Firestore!`, 'success');
                        subscribeToFirestore();
                    } else {
                        setFbStatus({
                            connected: false,
                            message: `Connection Failed: ${res.error}`,
                            type: 'error'
                        });
                        showToast(`Firestore Error: ${res.error}`, 'error');
                    }
                } catch (err) {
                    setFbStatus({
                        connected: false,
                        message: `Invalid JSON format or config: ${err.message}`,
                        type: 'error'
                    });
                    showToast(`Config error: ${err.message}`, 'error');
                } finally {
                    setIsTestingFb(false);
                }
            };

            // Add or Edit Expense Handler
            const handleSubmitExpense = async (e) => {
                e.preventDefault();
                if (!formData.title.trim() || !formData.amount || parseFloat(formData.amount) <= 0) {
                    showToast('Please provide a valid title and positive amount', 'error');
                    return;
                }

                const expensePayload = {
                    id: editingExpense ? editingExpense.id : `local_${Date.now()}`,
                    title: formData.title.trim(),
                    amount: parseFloat(formData.amount),
                    category: formData.category,
                    date: formData.date,
                    notes: formData.notes
                };

                if (fbStatus.connected && FirebaseService.db) {
                    try {
                        await FirebaseService.saveExpense(expensePayload);
                        showToast(editingExpense ? 'Expense updated in Cloud Firestore!' : 'Expense saved to Cloud Firestore!');
                    } catch (err) {
                        console.error("Firestore Save Error:", err);
                        showToast(`Cloud sync failed: ${err.message}. Saving locally.`, 'error');
                        // Local fallback
                        updateLocalStorageWithItem(expensePayload);
                    }
                } else {
                    updateLocalStorageWithItem(expensePayload);
                    showToast(editingExpense ? 'Expense updated locally' : 'Expense saved locally');
                }

                closeModal();
            };

            const updateLocalStorageWithItem = (item) => {
                let updated;
                if (editingExpense) {
                    updated = expenses.map(e => e.id === item.id ? item : e);
                } else {
                    updated = [item, ...expenses];
                }
                saveLocalExpenses(updated);
            };

            // Delete Expense Handler
            const handleDeleteExpense = async (id) => {
                if (!confirm("Are you sure you want to delete this expense?")) return;

                if (fbStatus.connected && FirebaseService.db && !id.startsWith('local_')) {
                    try {
                        await FirebaseService.deleteExpense(id);
                        showToast('Expense deleted from Cloud Firestore');
                    } catch (err) {
                        console.error("Delete error:", err);
                        showToast(`Failed to delete from Cloud: ${err.message}`, 'error');
                    }
                } else {
                    const updated = expenses.filter(e => e.id !== id);
                    saveLocalExpenses(updated);
                    showToast('Expense deleted');
                }
            };

            const openAddModal = () => {
                setEditingExpense(null);
                setFormData({
                    title: '',
                    amount: '',
                    category: 'food',
                    date: new Date().toISOString().split('T')[0],
                    notes: ''
                });
                setIsModalOpen(true);
            };

            const openEditModal = (expense) => {
                setEditingExpense(expense);
                setFormData({
                    title: expense.title,
                    amount: expense.amount,
                    category: expense.category,
                    date: expense.date || new Date().toISOString().split('T')[0],
                    notes: expense.notes || ''
                });
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingExpense(null);
            };

            // Calculations & Aggregation
            const filteredExpenses = useMemo(() => {
                return expenses.filter(exp => {
                    const matchesSearch = exp.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          (exp.notes && exp.notes.toLowerCase().includes(searchQuery.toLowerCase()));
                    const matchesCategory = selectedCategory === 'all' || exp.category === selectedCategory;
                    return matchesSearch && matchesCategory;
                });
            }, [expenses, searchQuery, selectedCategory]);

            const totalSpent = useMemo(() => {
                return filteredExpenses.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
            }, [filteredExpenses]);

            // CSV Export
            const exportToCSV = () => {
                if (expenses.length === 0) {
                    showToast('No expenses available to export', 'error');
                    return;
                }
                const headers = ['ID', 'Date', 'Title', 'Category', 'Amount (INR)', 'Notes'];
                const rows = expenses.map(e => [
                    `"${e.id}"`,
                    `"${e.date}"`,
                    `"${e.title.replace(/"/g, '""')}"`,
                    `"${e.category}"`,
                    e.amount,
                    `"${(e.notes || '').replace(/"/g, '""')}"`
                ]);
                
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `expenses_report_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Exported expenses report CSV');
            };

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col max-w-md mx-auto shadow-2xl relative pb-20">
                    {/* Header */}
                    <header className="bg-gradient-to-r from-indigo-700 via-indigo-600 to-violet-700 text-white p-4 pt-6 rounded-b-2xl shadow-md">
                        <div className="flex justify-between items-center mb-3">
                            <div>
                                <h1 className="text-xl font-bold tracking-tight flex items-center gap-2">
                                    <span>💸</span> My Pocket Track
                                </h1>
                                <p className="text-xs text-indigo-200">Mobile Expense Manager</p>
                            </div>
                            <button 
                                onClick={() => setActiveTab('settings')}
                                className="p-2 bg-white/10 hover:bg-white/20 rounded-xl transition backdrop-blur-sm relative"
                                title="Cloud Sync Settings"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                <span className={`absolute top-1 right-1 w-2.5 h-2.5 rounded-full ${fbStatus.connected ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'}`}></span>
                            </button>
                        </div>

                        {/* Summary Card */}
                        <div className="bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/20 mt-2">
                            <div className="text-xs text-indigo-100 uppercase tracking-wider font-semibold">Total Expenses</div>
                            <div className="text-3xl font-extrabold mt-1 tracking-tight">
                                {formatINR(totalSpent)}
                            </div>
                            <div className="flex justify-between items-center mt-3 pt-2 border-t border-white/10 text-xs">
                                <span className="flex items-center gap-1.5">
                                    <span className={`w-2 h-2 rounded-full ${fbStatus.connected ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                                    {fbStatus.connected ? 'Firestore Live' : 'Offline Local'}
                                </span>
                                <span>{expenses.length} Records</span>
                            </div>
                        </div>
                    </header>

                    {/* Toast Alert */}
                    {toast && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transition transform duration-200 max-w-xs text-center ${
                            toast.type === 'error' ? 'bg-red-600 text-white' : 
                            toast.type === 'info' ? 'bg-blue-600 text-white' : 'bg-emerald-600 text-white'
                        }`}>
                            <span>{toast.type === 'error' ? '⚠️' : toast.type === 'info' ? 'ℹ️' : '✅'}</span>
                            <span className="truncate">{toast.message}</span>
                        </div>
                    )}

                    {/* Main Content Areas */}
                    <main className="flex-1 p-4 space-y-4">
                        {loading ? (
                            <div className="flex flex-col items-center justify-center py-20 text-gray-400">
                                <div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                                <p className="text-sm">Connecting & Loading Data...</p>
                            </div>
                        ) : (
                            <>
                                {activeTab === 'dashboard' && (
                                    <DashboardView 
                                        expenses={expenses} 
                                        openAddModal={openAddModal} 
                                        openEditModal={openEditModal}
                                        handleDeleteExpense={handleDeleteExpense}
                                    />
                                )}

                                {activeTab === 'transactions' && (
                                    <TransactionsView 
                                        expenses={filteredExpenses} 
                                        searchQuery={searchQuery}
                                        setSearchQuery={setSearchQuery}
                                        selectedCategory={selectedCategory}
                                        setSelectedCategory={setSelectedCategory}
                                        openEditModal={openEditModal}
                                        handleDeleteExpense={handleDeleteExpense}
                                        exportToCSV={exportToCSV}
                                    />
                                )}

                                {activeTab === 'analytics' && (
                                    <AnalyticsView 
                                        expenses={expenses} 
                                        chartTimeframe={chartTimeframe}
                                        setChartTimeframe={setChartTimeframe}
                                    />
                                )}

                                {activeTab === 'settings' && (
                                    <SettingsView 
                                        fbConfigText={fbConfigText}
                                        setFbConfigText={setFbConfigText}
                                        handleTestAndSaveFirebase={handleTestAndSaveFirebase}
                                        fbStatus={fbStatus}
                                        isTestingFb={isTestingFb}
                                        exportToCSV={exportToCSV}
                                    />
                                )}
                            </>
                        )}
                    </main>

                    {/* Floating Add Button */}
                    <button 
                        onClick={openAddModal}
                        className="fixed bottom-20 right-6 md:right-1/2 md:translate-x-[180px] w-14 h-14 bg-gradient-to-tr from-indigo-600 to-violet-600 text-white rounded-full shadow-lg hover:shadow-indigo-500/30 flex items-center justify-center text-2xl font-light hover:scale-105 active:scale-95 transition-all z-30"
                        title="Add New Expense"
                    >
                        ➕
                    </button>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 px-3 py-2 flex justify-around items-center z-40 pb-safe shadow-lg">
                        <NavButton 
                            label="Home" 
                            active={activeTab === 'dashboard'} 
                            onClick={() => setActiveTab('dashboard')}
                            icon={<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>}
                        />
                        <NavButton 
                            label="History" 
                            active={activeTab === 'transactions'} 
                            onClick={() => setActiveTab('transactions')}
                            icon={<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>}
                        />
                        <NavButton 
                            label="Analytics" 
                            active={activeTab === 'analytics'} 
                            onClick={() => setActiveTab('analytics')}
                            icon={<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 3.055A9.001 9.001 0 0120 12M11 3.055A9.001 9.001 0 003 12m8-8.945V12m0 0h9"></path>}
                        />
                        <NavButton 
                            label="Sync" 
                            active={activeTab === 'settings'} 
                            onClick={() => setActiveTab('settings')}
                            icon={<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>}
                        />
                    </nav>

                    {/* Add / Edit Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
                            <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto animate-in slide-in-from-bottom duration-200">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="text-lg font-bold text-gray-800">
                                        {editingExpense ? 'Edit Expense' : 'Add New Expense'}
                                    </h2>
                                    <button onClick={closeModal} className="text-gray-400 hover:text-gray-600 p-1">✕</button>
                                </div>

                                <form onSubmit={handleSubmitExpense} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase">Title / Name</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="e.g. Swiggy Lunch, Fuel, Rent" 
                                            value={formData.title}
                                            onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase">Amount (₹ INR)</label>
                                        <div className="relative">
                                            <span className="absolute left-3.5 top-2.5 text-gray-500 font-bold">₹</span>
                                            <input 
                                                type="number" 
                                                step="0.01" 
                                                required 
                                                placeholder="0.00" 
                                                value={formData.amount}
                                                onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                                                className="w-full pl-8 pr-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase">Category</label>
                                        <select 
                                            value={formData.category}
                                            onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        >
                                            {CATEGORIES.map(cat => (
                                                <option key={cat.id} value={cat.id}>
                                                    {cat.icon} {cat.name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase">Date</label>
                                        <input 
                                            type="date" 
                                            required 
                                            value={formData.date}
                                            onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase">Notes (Optional)</label>
                                        <textarea 
                                            rows="2" 
                                            placeholder="Add additional details..." 
                                            value={formData.notes}
                                            onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={closeModal}
                                            className="flex-1 py-2.5 border border-gray-300 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition text-sm"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow-md shadow-indigo-200 text-sm"
                                        >
                                            {editingExpense ? 'Update' : 'Save Expense'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- SUB VIEWS ---

        function DashboardView({ expenses, openAddModal, openEditModal, handleDeleteExpense }) {
            const recentExpenses = expenses.slice(0, 5);

            // Category Breakdown Stats
            const categorySums = useMemo(() => {
                const map = {};
                expenses.forEach(exp => {
                    map[exp.category] = (map[exp.category] || 0) + (parseFloat(exp.amount) || 0);
                });
                return map;
            }, [expenses]);

            return (
                <div className="space-y-4">
                    {/* Recent Transactions List */}
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-sm font-bold text-gray-800 uppercase tracking-wider">Recent Activity</h2>
                            <span className="text-xs text-indigo-600 font-semibold">{expenses.length} Total</span>
                        </div>

                        {recentExpenses.length === 0 ? (
                            <div className="text-center py-8 text-gray-400">
                                <p className="text-3xl mb-1">🧾</p>
                                <p className="text-sm">No expenses logged yet</p>
                                <button onClick={openAddModal} className="mt-3 text-xs bg-indigo-50 text-indigo-600 font-semibold px-3 py-1.5 rounded-lg border border-indigo-200">
                                    + Add Your First Expense
                                </button>
                            </div>
                        ) : (
                            <div className="divide-y divide-gray-100">
                                {recentExpenses.map(item => (
                                    <ExpenseRow 
                                        key={item.id} 
                                        item={item} 
                                        onEdit={() => openEditModal(item)}
                                        onDelete={() => handleDeleteExpense(item.id)}
                                    />
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Quick Category Summary */}
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                        <h2 className="text-sm font-bold text-gray-800 uppercase tracking-wider mb-3">Top Spending Categories</h2>
                        <div className="space-y-2.5">
                            {CATEGORIES.map(cat => {
                                const amount = categorySums[cat.id] || 0;
                                if (amount === 0) return null;
                                return (
                                    <div key={cat.id} className="flex items-center justify-between text-xs">
                                        <div className="flex items-center gap-2">
                                            <span>{cat.icon}</span>
                                            <span className="font-medium text-gray-700">{cat.name}</span>
                                        </div>
                                        <span className="font-bold text-gray-900">{formatINR(amount)}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function TransactionsView({ expenses, searchQuery, setSearchQuery, selectedCategory, setSelectedCategory, openEditModal, handleDeleteExpense, exportToCSV }) {
            return (
                <div className="space-y-3">
                    {/* Search & Filter Controls */}
                    <div className="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                        <div className="relative">
                            <span className="absolute left-3 top-2.5 text-gray-400 text-xs">🔍</span>
                            <input 
                                type="text" 
                                placeholder="Search by title or notes..." 
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full pl-8 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"
                            />
                        </div>

                        <div className="flex gap-2">
                            <select 
                                value={selectedCategory}
                                onChange={(e) => setSelectedCategory(e.target.value)}
                                className="flex-1 py-2 px-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium focus:outline-none"
                            >
                                <option value="all">All Categories</option>
                                {CATEGORIES.map(cat => (
                                    <option key={cat.id} value={cat.id}>{cat.icon} {cat.name}</option>
                                ))}
                            </select>

                            <button 
                                onClick={exportToCSV}
                                className="px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-semibold flex items-center gap-1 hover:bg-emerald-100"
                            >
                                <span>📥</span> Export CSV
                            </button>
                        </div>
                    </div>

                    {/* Expense Items List */}
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 divide-y divide-gray-100">
                        {expenses.length === 0 ? (
                            <div className="text-center py-8 text-gray-400 text-xs">
                                No expenses matching search or filters.
                            </div>
                        ) : (
                            expenses.map(item => (
                                <ExpenseRow 
                                    key={item.id} 
                                    item={item} 
                                    onEdit={() => openEditModal(item)}
                                    onDelete={() => handleDeleteExpense(item.id)}
                                />
                            ))
                        )}
                    </div>
                </div>
            );
        }

        function AnalyticsView({ expenses, chartTimeframe, setChartTimeframe }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Aggregate Data according to Timeframe
            const chartData = useMemo(() => {
                const map = {};
                
                expenses.forEach(exp => {
                    if (!exp.date) return;
                    const dateObj = new Date(exp.date);
                    let key = exp.date;

                    if (chartTimeframe === 'weekly') {
                        // Group by Day of week (Mon, Tue...)
                        key = dateObj.toLocaleDateString('en-IN', { weekday: 'short' });
                    } else if (chartTimeframe === 'monthly') {
                        // Group by Month (Jan, Feb...)
                        key = dateObj.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
                    } else if (chartTimeframe === 'yearly') {
                        // Group by Year
                        key = dateObj.getFullYear().toString();
                    }

                    map[key] = (map[key] || 0) + (parseFloat(exp.amount) || 0);
                });

                return {
                    labels: Object.keys(map),
                    values: Object.values(map)
                };
            }, [expenses, chartTimeframe]);

            useEffect(() => {
                if (!chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: chartData.labels.length > 0 ? chartData.labels : ['No Data'],
                        datasets: [{
                            label: 'Expense (₹)',
                            data: chartData.values.length > 0 ? chartData.values : [0],
                            backgroundColor: 'rgba(99, 102, 241, 0.85)',
                            borderColor: 'rgba(79, 70, 229, 1)',
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: (val) => '₹' + val
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [chartData]);

            return (
                <div className="space-y-4">
                    {/* Timeframe selector */}
                    <div className="flex bg-gray-200 p-1 rounded-xl">
                        {['weekly', 'monthly', 'yearly'].map(tf => (
                            <button 
                                key={tf}
                                onClick={() => setChartTimeframe(tf)}
                                className={`flex-1 py-1.5 text-xs font-semibold rounded-lg capitalize transition ${
                                    chartTimeframe === tf ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600'
                                }`}
                            >
                                {tf}
                            </button>
                        ))}
                    </div>

                    {/* Chart Container */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4">Spending Breakdown</h2>
                        <div className="h-64 relative">
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>
                </div>
            );
        }

        function SettingsView({ fbConfigText, setFbConfigText, handleTestAndSaveFirebase, fbStatus, isTestingFb, exportToCSV }) {
            return (
                <div className="space-y-4">
                    {/* Connection Status Banner */}
                    <div className={`p-4 rounded-2xl border text-xs space-y-2 ${
                        fbStatus.connected 
                            ? 'bg-emerald-50 border-emerald-200 text-emerald-800' 
                            : fbStatus.type === 'error'
                            ? 'bg-red-50 border-red-200 text-red-800'
                            : 'bg-amber-50 border-amber-200 text-amber-800'
                    }`}>
                        <div className="flex items-center gap-2 font-bold text-sm">
                            <span>{fbStatus.connected ? '🟢' : fbStatus.type === 'error' ? '🔴' : '🟡'}</span>
                            <span>{fbStatus.connected ? 'Cloud Firestore Connected' : 'Firestore Not Connected'}</span>
                        </div>
                        <p className="leading-relaxed">{fbStatus.message}</p>
                        {fbStatus.projectId && (
                            <div className="font-mono text-[10px] bg-white/60 p-1.5 rounded border border-emerald-300">
                                Project ID: {fbStatus.projectId}
                            </div>
                        )}
                    </div>

                    {/* Configuration Form */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                        <div>
                            <h2 className="text-sm font-bold text-gray-800">Firebase Firestore Configuration</h2>
                            <p className="text-xs text-gray-500 mt-0.5">
                                Paste your Firebase Project JS SDK configuration object below.
                            </p>
                        </div>

                        <textarea 
                            rows="7"
                            value={fbConfigText}
                            onChange={(e) => setFbConfigText(e.target.value)}
                            placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "app.firebaseapp.com",\n  "projectId": "my-project-id",\n  "storageBucket": "app.appspot.com",\n  "messagingSenderId": "123456",\n  "appId": "1:123:web:abc"\n}`}
                            className="w-full p-3 font-mono text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />

                        <div className="flex gap-2">
                            <button 
                                onClick={handleTestAndSaveFirebase}
                                disabled={isTestingFb}
                                className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-md transition disabled:opacity-50 flex items-center justify-center gap-1.5"
                            >
                                {isTestingFb ? (
                                    <>
                                        <span className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                                        <span>Testing Connection...</span>
                                    </>
                                ) : (
                                    <span>⚡ Test Connection & Save</span>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Manual Backup / CSV Export */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                        <h3 className="text-xs font-bold text-gray-800 uppercase tracking-wider">Local Data Management</h3>
                        <p className="text-xs text-gray-500">Download a copy of your records in CSV format anytime.</p>
                        <button 
                            onClick={exportToCSV}
                            className="w-full py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl text-xs transition"
                        >
                            Export All Data to CSV
                        </button>
                    </div>
                </div>
            );
        }

        // Shared Reusable Expense Row Component
        function ExpenseRow({ item, onEdit, onDelete }) {
            const cat = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[CATEGORIES.length - 1];

            return (
                <div className="py-3 flex items-center justify-between group">
                    <div className="flex items-center gap-3 min-w-0">
                        <div className="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-lg shrink-0">
                            {cat.icon}
                        </div>
                        <div className="min-w-0">
                            <h3 className="text-sm font-semibold text-gray-800 truncate">{item.title}</h3>
                            <div className="flex items-center gap-2 text-xs text-gray-400">
                                <span>{formatDate(item.date)}</span>
                                <span>•</span>
                                <span className="capitalize">{cat.name}</span>
                            </div>
                            {item.notes && <p className="text-[11px] text-gray-400 truncate mt-0.5">{item.notes}</p>}
                        </div>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                        <span className="font-bold text-sm text-gray-900">{formatINR(item.amount)}</span>
                        <div className="flex items-center">
                            <button onClick={onEdit} className="p-1.5 text-gray-400 hover:text-indigo-600 rounded-lg">✏️</button>
                            <button onClick={onDelete} className="p-1.5 text-gray-400 hover:text-red-600 rounded-lg">🗑️</button>
                        </div>
                    </div>
                </div>
            );
        }

        // Navigation Button Helper
        function NavButton({ label, active, onClick, icon }) {
            return (
                <button 
                    onClick={onClick}
                    className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition ${
                        active ? 'text-indigo-600 font-bold' : 'text-gray-400 hover:text-gray-600 font-medium'
                    }`}
                >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        {icon}
                    </svg>
                    <span className="text-[10px]">{label}</span>
                </button>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
