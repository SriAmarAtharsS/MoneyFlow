<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketTrack INR - Mobile Expense Manager</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase 9 Compat Scripts (App & Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    /* Hide scrollbars for clean look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Claymorphism Design System Styles - Dark Mode */
    .theme-dark .clay-card {
      background: #1e293b;
      border-radius: 24px;
      box-shadow: 
        8px 8px 16px rgba(0, 0, 0, 0.45),
        -6px -6px 14px rgba(255, 255, 255, 0.05),
        inset 2px 2px 4px rgba(255, 255, 255, 0.08),
        inset -2px -2px 4px rgba(0, 0, 0, 0.4);
    }

    /* Claymorphism Design System Styles - Light Mode */
    .theme-light .clay-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 
        8px 8px 20px rgba(148, 163, 184, 0.35),
        -6px -6px 16px rgba(255, 255, 255, 0.9),
        inset 2px 2px 4px rgba(255, 255, 255, 0.8),
        inset -2px -2px 4px rgba(203, 213, 225, 0.4);
    }

    .theme-dark .clay-card-emerald {
      background: linear-gradient(145deg, #064e3b, #022c22);
      border-radius: 28px;
      box-shadow: 
        10px 10px 20px rgba(0, 0, 0, 0.3),
        -6px -6px 14px rgba(16, 185, 129, 0.15),
        inset 3px 3px 6px rgba(52, 211, 153, 0.25),
        inset -3px -3px 6px rgba(0, 0, 0, 0.5);
    }

    .theme-light .clay-card-emerald {
      background: linear-gradient(145deg, #dcfce7, #bbf7d0);
      border-radius: 28px;
      box-shadow: 
        8px 8px 20px rgba(16, 185, 129, 0.25),
        -6px -6px 16px rgba(255, 255, 255, 0.9),
        inset 2px 2px 4px rgba(255, 255, 255, 0.8),
        inset -2px -2px 4px rgba(134, 239, 172, 0.5);
    }

    .clay-pill {
      border-radius: 9999px;
    }

    .theme-dark .clay-pill {
      box-shadow: 
        4px 4px 8px rgba(0, 0, 0, 0.35),
        -3px -3px 6px rgba(255, 255, 255, 0.05),
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.1),
        inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.3);
    }

    .theme-light .clay-pill {
      box-shadow: 
        4px 4px 8px rgba(148, 163, 184, 0.25),
        -3px -3px 6px rgba(255, 255, 255, 0.9),
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.8),
        inset -1.5px -1.5px 3px rgba(203, 213, 225, 0.3);
    }

    .clay-btn {
      border-radius: 16px;
      transition: all 0.15s ease-in-out;
    }

    .theme-dark .clay-btn {
      background: #1e293b;
      box-shadow: 
        5px 5px 10px rgba(0, 0, 0, 0.4),
        -4px -4px 8px rgba(255, 255, 255, 0.05),
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.1),
        inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.3);
    }

    .theme-light .clay-btn {
      background: #f1f5f9;
      box-shadow: 
        5px 5px 10px rgba(148, 163, 184, 0.3),
        -4px -4px 8px rgba(255, 255, 255, 0.9),
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.8),
        inset -1.5px -1.5px 3px rgba(203, 213, 225, 0.4);
    }

    .clay-btn:active, .clay-btn-active {
      transform: translateY(1px);
    }

    .theme-dark .clay-btn:active, .theme-dark .clay-btn-active {
      box-shadow: 
        inset 4px 4px 8px rgba(0, 0, 0, 0.6),
        inset -3px -3px 6px rgba(255, 255, 255, 0.05);
    }

    .theme-light .clay-btn:active, .theme-light .clay-btn-active {
      box-shadow: 
        inset 4px 4px 8px rgba(203, 213, 225, 0.7),
        inset -3px -3px 6px rgba(255, 255, 255, 0.8);
    }

    .clay-btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      box-shadow: 
        6px 6px 12px rgba(0, 0, 0, 0.25),
        -4px -4px 8px rgba(52, 211, 153, 0.2),
        inset 2px 2px 4px rgba(255, 255, 255, 0.3),
        inset -2px -2px 4px rgba(0, 0, 0, 0.3);
    }

    .clay-btn-primary:active {
      box-shadow: 
        inset 4px 4px 8px rgba(0, 0, 0, 0.5),
        inset -2px -2px 4px rgba(255, 255, 255, 0.2);
    }

    .theme-dark .clay-header, .theme-dark .clay-nav {
      background: #0f172a;
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.5);
    }

    .theme-light .clay-header, .theme-light .clay-nav {
      background: #ffffff;
      box-shadow: 0 4px 12px -2px rgba(148, 163, 184, 0.25);
    }

    .clay-nav {
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    .touch-press:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

      Search: (props) => <Icon {...props} path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
      Download: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} />,
      X: (props) => <Icon {...props} path={<><path d="M18 6L6 18"/><path d="M6 6l12 12"/></>} />,

      ShoppingBag: (props) => <Icon {...props} path={<><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>} />,
      Car: (props) => <Icon {...props} path={<><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.3.3-1.8.7C4.3 8.6 3 10 3 10s-2.7.6-4.5 1.1C.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></>} />,
      Film: (props) => <Icon {...props} path={<><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></>} />,
      HeartPulse: (props) => <Icon {...props} path={<><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></>} />,

      Zap: (props) => <Icon {...props} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>} />,
      PieChart: (props) => <Icon {...props} path={<><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>} />,
      Calendar: (props) => <Icon {...props} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
      CheckCircle2: (props) => <Icon {...props} path={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>} />,
      Loader2: (props) => <Icon {...props} path={<><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></>} />,
      Briefcase: (props) => <Icon {...props} path={<><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></>} />,
      Landmark: (props) => <Icon {...props} path={<><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/></>} />,

      PiggyBank: (props) => <Icon {...props} path={<><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-3.5c1-.5 2-1 2.5-2.5 1-.5 2.5-2 2.5-4 0-1.5-1-2.5-2.5-3-.2-.5-1-2-2.5-2z"/><path d="M16 11h.01"/></>} />,
      Shield: (props) => <Icon {...props} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />,
      GraduationCap: (props) => <Icon {...props} path={<><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></>} />,
      Home: (props) => <Icon {...props} path={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
      Sun: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>} />,
      Moon: (props) => <Icon {...props} path={<><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></>} />

    // --- INR Currency Formatter ---
    const formatINR = (val) => {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(val || 0);
    };

    // --- Comprehensive Indian Expense Categories ---
    const EXPENSE_CATEGORIES = [
      { id: 'Food', label: 'Food & Dining', icon: Icons.Utensils, color: '#f59e0b', textClass: 'text-amber-400', bgClass: 'bg-amber-500/10' },
      { id: 'Groceries', label: 'Groceries & Provisions', icon: Icons.ShoppingBag, color: '#10b981', textClass: 'text-emerald-400', bgClass: 'bg-emerald-500/10' },
      { id: 'Housing', label: 'Housing & Rent', icon: Icons.Home, color: '#8b5cf6', textClass: 'text-violet-400', bgClass: 'bg-violet-500/10' },
      { id: 'Bills', label: 'Bills & Utilities', icon: Icons.Zap, color: '#3b82f6', textClass: 'text-blue-400', bgClass: 'bg-blue-500/10' },
      { id: 'Transport', label: 'Transport & Fuel', icon: Icons.Car, color: '#06b6d4', textClass: 'text-cyan-400', bgClass: 'bg-cyan-500/10' },
      { id: 'Shopping', label: 'Shopping & Retail', icon: Icons.Tag, color: '#ec4899', textClass: 'text-pink-400', bgClass: 'bg-pink-500/10' },
      { id: 'Entertainment', label: 'Entertainment & OTT', icon: Icons.Film, color: '#a855f7', textClass: 'text-purple-400', bgClass: 'bg-purple-500/10' },
      { id: 'Health', label: 'Health & Medical', icon: Icons.HeartPulse, color: '#f43f5e', textClass: 'text-rose-400', bgClass: 'bg-rose-500/10' },
      { id: 'Insurance', label: 'Insurance & Financial', icon: Icons.Shield, color: '#6366f1', textClass: 'text-indigo-400', bgClass: 'bg-indigo-500/10' },
      { id: 'Education', label: 'Education & Courses', icon: Icons.GraduationCap, color: '#0284c7', textClass: 'text-sky-400', bgClass: 'bg-sky-500/10' },
      { id: 'Investments', label: 'Investments & Savings', icon: Icons.PiggyBank, color: '#14b8a6', textClass: 'text-teal-400', bgClass: 'bg-teal-500/10' },
      { id: 'Others', label: 'Others', icon: Icons.CreditCard, color: '#64748b', textClass: 'text-slate-400', bgClass: 'bg-slate-500/10' }
    ];

    // --- Comprehensive Indian Income Categories ---
    const INCOME_CATEGORIES = [
      { id: 'Salary', label: 'Salary & Wage', icon: Icons.Briefcase, color: '#10b981', textClass: 'text-emerald-400', bgClass: 'bg-emerald-500/10' },
      { id: 'Freelance', label: 'Freelance & Business', icon: Icons.Briefcase, color: '#3b82f6', textClass: 'text-blue-400', bgClass: 'bg-blue-500/10' },
      { id: 'Investments', label: 'Investments & Mutual Funds', icon: Icons.Landmark, color: '#8b5cf6', textClass: 'text-purple-400', bgClass: 'bg-purple-500/10' },
      { id: 'Cashback', label: 'Cashback & Rewards', icon: Icons.Tag, color: '#f59e0b', textClass: 'text-amber-400', bgClass: 'bg-amber-500/10' },
      { id: 'Gifts', label: 'Gifts & Allowances', icon: Icons.Gift, color: '#ec4899', textClass: 'text-pink-400', bgClass: 'bg-pink-500/10' },
      { id: 'Rental', label: 'Rental Income', icon: Icons.Home, color: '#06b6d4', textClass: 'text-cyan-400', bgClass: 'bg-cyan-500/10' },
      { id: 'Other Income', label: 'Other Income', icon: Icons.Rupee, color: '#64748b', textClass: 'text-slate-400', bgClass: 'bg-slate-500/10' }
    ];

    // --- Combined Category Lookup ---
    const ALL_CATEGORIES = [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES];

    const getCategoryInfo = (catId, type = 'expense') => {
      const list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
      return list.find(c => c.id === catId) || ALL_CATEGORIES.find(c => c.id === catId) || {
        id: catId,
        label: catId,
        icon: Icons.CreditCard,
        color: '#64748b',
        textClass: 'text-slate-400',
        bgClass: 'bg-slate-500/10'
      };
    };

    // --- Comprehensive Payment Modes in Indian Ecosystem ---
    const PAYMENT_METHODS = [
      'UPI',
      'Credit Card',
      'Debit Card',
      'Net Banking',
      'Cash',
      'Wallet',
      'Bank Transfer / NEFT / IMPS'
    ];

    // --- Firebase Service ---
    const FirebaseService = {
      db: null,
      unsubscribe: null,

      async init(configJson) {
        try {
          if (!configJson) return { success: false, error: 'No configuration provided' };
          let parsedConfig = typeof configJson === 'string' ? JSON.parse(configJson) : configJson;
          
          if (!parsedConfig.apiKey || !parsedConfig.projectId) {
            throw new Error("Invalid config: 'apiKey' and 'projectId' are required.");
          }

          if (window.firebase && firebase.apps.length > 0) {
            await Promise.all(firebase.apps.map(app => app.delete()));
          }

          const app = firebase.initializeApp(parsedConfig);
          this.db = firebase.firestore(app);
          const testSnap = await this.db.collection('expenses').limit(1).get();
          
          return { success: true, projectId: parsedConfig.projectId, itemCount: testSnap.size };
        } catch (err) {
          console.error("Firebase Init Error:", err);
          this.db = null;
          return { success: false, error: err.message || 'Failed to initialize Firebase' };
        }
      },

      async saveExpense(expense) {
        if (!this.db) throw new Error("Firestore not initialized");
        const cleanData = {
          title: expense.title,
          amount: parseFloat(expense.amount),
          type: expense.type || 'expense',
          category: expense.category,
          date: expense.date,
          paymentMethod: expense.paymentMethod || 'UPI',
          note: expense.note || '',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (expense.id && typeof expense.id === 'string' && !expense.id.startsWith('local_')) {
          await this.db.collection('expenses').doc(expense.id).set(cleanData, { merge: true });
          return expense.id;
        } else {
          cleanData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          const docRef = await this.db.collection('expenses').add(cleanData);
          return docRef.id;
        }
      },

      async deleteExpense(id) {
        if (!this.db) throw new Error("Firestore not initialized");
        await this.db.collection('expenses').doc(id).delete();
      }
    };

    // --- Rich Demo Default Data ---
    const INITIAL_TRANSACTIONS = [
      { id: '1', title: 'Monthly Tech Salary', amount: 95000, type: 'income', category: 'Salary', date: '2026-10-01', paymentMethod: 'Bank Transfer / NEFT / IMPS', note: 'Software Engineer Salary' },
      { id: '2', title: 'Apartment Maintenance & Rent', amount: 24000, type: 'expense', category: 'Housing', date: '2026-10-02', paymentMethod: 'UPI', note: '2BHK Apartment' },
      { id: '3', title: 'D-Mart Monthly Provisions', amount: 5850, type: 'expense', category: 'Groceries', date: '2026-10-05', paymentMethod: 'UPI', note: 'Monthly groceries' },
      { id: '4', title: 'Electricity & Broadband Bill', amount: 2900, type: 'expense', category: 'Bills', date: '2026-10-10', paymentMethod: 'Credit Card', note: 'Fiber net + Power bill' },
      { id: '5', title: 'Freelance Web Design', amount: 18000, type: 'income', category: 'Freelance', date: '2026-10-14', paymentMethod: 'Net Banking', note: 'Client website completion' },
      { id: '6', title: 'PVR IMAX & Dinner Outing', amount: 2400, type: 'expense', category: 'Entertainment', date: '2026-10-18', paymentMethod: 'UPI', note: 'Weekend movie & dinner' },
      { id: '7', title: 'Petrol Refill - Honda City', amount: 3200, type: 'expense', category: 'Transport', date: '2026-10-22', paymentMethod: 'Debit Card', note: 'Full tank fuel' },
      { id: '8', title: 'Apollo Pharmacy Medicines', amount: 1150, type: 'expense', category: 'Health', date: '2026-10-24', paymentMethod: 'UPI', note: 'Family medical' },
      { id: '9', title: 'Zomato Gourmet Dinner', amount: 680, type: 'expense', category: 'Food', date: '2026-10-25', paymentMethod: 'UPI', note: 'Dinner order' },
      { id: '10', title: 'Festive Apparel Shopping', amount: 4500, type: 'expense', category: 'Shopping', date: '2026-10-26', paymentMethod: 'Credit Card', note: 'Diwali wear' },
      { id: '11', title: 'SIP Investment Mutual Fund', amount: 10000, type: 'expense', category: 'Investments', date: '2026-10-05', paymentMethod: 'Net Banking', note: 'Nifty 50 Index Fund' },
      { id: '12', title: 'Health Insurance Premium', amount: 8500, type: 'expense', category: 'Insurance', date: '2026-09-20', paymentMethod: 'Credit Card', note: 'Annual Floater Plan' },
      { id: '13', title: 'Cred App Reward Cashback', amount: 350, type: 'income', category: 'Cashback', date: '2026-10-12', paymentMethod: 'UPI', note: 'Bill payment reward' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [theme, setTheme] = useState(() => localStorage.getItem('pocket_inr_theme') || 'dark');
      const [transactions, setTransactions] = useState([]);
      const [monthlyBudget, setMonthlyBudget] = useState(() => Number(localStorage.getItem('pocket_inr_budget')) || 60000);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCat, setSelectedCat] = useState('All');
      const [selectedPayment, setSelectedPayment] = useState('All');
      const [topFeedSort, setTopFeedSort] = useState('all');

      const [analyticsTimeframe, setAnalyticsTimeframe] = useState('Monthly');
      const [analyticsType, setAnalyticsType] = useState('expense'); // 'expense' or 'income'
      const [customStartDate, setCustomStartDate] = useState(() => {
        const d = new Date();
        d.setMonth(d.getMonth() - 1);
        return d.toISOString().split('T')[0];
      });
      const [customEndDate, setCustomEndDate] = useState(() => new Date().toISOString().split('T')[0]);

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);

      const [formData, setFormData] = useState({
        title: '',
        amount: '',
        type: 'expense',
        category: 'Food',
        date: new Date().toISOString().split('T')[0],
        paymentMethod: 'UPI',
        note: ''
      });

      const [firebaseConfig, setFirebaseConfig] = useState(() => localStorage.getItem('pocket_inr_fb') || '');
      const [fbStatus, setFbStatus] = useState({
        connected: false,
        message: 'Not connected to Cloud Firestore',
        type: 'info',
        projectId: ''
      });
      const [isTestingFb, setIsTestingFb] = useState(false);

      const categoryChartRef = useRef(null);
      const trendChartRef = useRef(null);
      const paymentChartRef = useRef(null);

      const categoryChartInstance = useRef(null);
      const trendChartInstance = useRef(null);
      const paymentChartInstance = useRef(null);

      useEffect(() => {
        localStorage.setItem('pocket_inr_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      useEffect(() => {
        let isMounted = true;
        const setupFirebase = async () => {
          const savedConfigStr = localStorage.getItem('pocket_inr_fb');
          if (savedConfigStr) {
            try {
              const res = await FirebaseService.init(savedConfigStr);
              if (isMounted) {
                if (res.success) {
                  setFbStatus({ connected: true, message: `Connected to Cloud Firestore`, projectId: res.projectId, type: 'success' });
                  subscribeToFirestore();
                } else {
                  setFbStatus({ connected: false, message: `Firestore connection error: ${res.error}`, type: 'error' });
                  loadLocalTransactions();
                }
              }
            } catch (err) {
              if (isMounted) {
                setFbStatus({ connected: false, message: `Configuration error: ${err.message}`, type: 'error' });
                loadLocalTransactions();
              }
            }
          } else {
            if (isMounted) {
              setFbStatus({ connected: false, message: 'Using Local Storage mode.', type: 'info' });
              loadLocalTransactions();
            }
          }
        };

        setupFirebase();

        return () => {
          isMounted = false;
          if (FirebaseService.unsubscribe) FirebaseService.unsubscribe();
        };
      }, []);

      const subscribeToFirestore = () => {
        if (!FirebaseService.db) return;
        if (FirebaseService.unsubscribe) FirebaseService.unsubscribe();

        FirebaseService.unsubscribe = FirebaseService.db
          .collection('expenses')
          .orderBy('date', 'desc')
          .onSnapshot(
            (snapshot) => {
              const docs = snapshot.docs.map(doc => {
                const data = doc.data();
                return { id: doc.id, ...data, amount: parseFloat(data.amount || 0) };
              });
              setTransactions(docs);
              localStorage.setItem('pocket_inr_txs_backup', JSON.stringify(docs));
            },
            (error) => {
              console.error("Firestore snapshot error:", error);
              loadLocalTransactions();
            }
          );
      };

      const loadLocalTransactions = () => {
        try {
          const saved = localStorage.getItem('pocket_inr_txs');
          if (saved) {
            setTransactions(JSON.parse(saved));
          } else {
            setTransactions(INITIAL_TRANSACTIONS);
            localStorage.setItem('pocket_inr_txs', JSON.stringify(INITIAL_TRANSACTIONS));
          }
        } catch (e) {
          setTransactions(INITIAL_TRANSACTIONS);
        }
      };

      const saveLocalTransactions = (updatedList) => {
        setTransactions(updatedList);
        localStorage.setItem('pocket_inr_txs', JSON.stringify(updatedList));
      };

      useEffect(() => {
        localStorage.setItem('pocket_inr_budget', monthlyBudget.toString());
      }, [monthlyBudget]);

      const totalIncome = useMemo(() => transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0), [transactions]);
      const totalExpense = useMemo(() => transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0), [transactions]);
      const netBalance = totalIncome - totalExpense;
      const remainingBudget = Math.max(0, monthlyBudget - totalExpense);
      const budgetSpentPercent = Math.min(100, Math.round((totalExpense / (monthlyBudget || 1)) * 100));

      // Show recent transactions strictly in reverse chronological order (newest first)
      const recentTransactions = useMemo(() => {
        return [...transactions]
          .filter(t => {
            if (topFeedSort === 'expense') return t.type === 'expense';
            if (topFeedSort === 'income') return t.type === 'income';
            return true;
          })
          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, topFeedSort]);

      const analyticsFilteredTransactions = useMemo(() => {
        const now = new Date();
        return transactions.filter(t => {
          if (!t.date) return false;
          if (t.type !== analyticsType) return false;
          const txDate = new Date(t.date);

          if (analyticsTimeframe === 'Weekly') {
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(now.getDate() - 7);
            return txDate >= sevenDaysAgo && txDate <= now;
          } else if (analyticsTimeframe === 'Monthly') {
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(now.getDate() - 30);
            return txDate >= thirtyDaysAgo && txDate <= now;
          } else if (analyticsTimeframe === 'Yearly') {
            const startOfYear = new Date(now.getFullYear(), 0, 1);
            return txDate >= startOfYear && txDate <= now;
          } else if (analyticsTimeframe === 'Custom') {
            if (!customStartDate || !customEndDate) return true;
            const start = new Date(customStartDate);
            const end = new Date(customEndDate);
            end.setHours(23, 59, 59, 999);
            return txDate >= start && txDate <= end;
          }
          return true;
        });
      }, [transactions, analyticsTimeframe, analyticsType, customStartDate, customEndDate]);

      const analyticsKPIs = useMemo(() => {
        const periodTotal = analyticsFilteredTransactions.reduce((sum, t) => sum + Number(t.amount), 0);

        let days = 1;
        if (analyticsTimeframe === 'Weekly') days = 7;
        else if (analyticsTimeframe === 'Monthly') days = 30;
        else if (analyticsTimeframe === 'Yearly') days = 365;
        else if (analyticsTimeframe === 'Custom' && customStartDate && customEndDate) {
          const diff = Math.abs(new Date(customEndDate) - new Date(customStartDate));
          days = Math.max(1, Math.ceil(diff / (1000 * 60 * 60 * 24)));
        }
        const dailyAvg = periodTotal / days;

        const catMap = {};
        analyticsFilteredTransactions.forEach(t => { catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount); });
        let topCat = 'None', maxCatAmount = 0;
        Object.entries(catMap).forEach(([cat, amt]) => {
          if (amt > maxCatAmount) { maxCatAmount = amt; topCat = cat; }
        });

        let highestTx = null;
        analyticsFilteredTransactions.forEach(t => {
          if (!highestTx || Number(t.amount) > Number(highestTx.amount)) highestTx = t;
        });

        return {
          periodTotal,
          dailyAvg,
          topCat,
          maxCatAmount,
          highestAmount: highestTx ? highestTx.amount : 0,
          highestTitle: highestTx ? highestTx.title : 'None',
          txCount: analyticsFilteredTransactions.length
        };
      }, [analyticsFilteredTransactions, analyticsTimeframe, customStartDate, customEndDate]);

      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchQuery = searchQuery === '' || 
            t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (t.note && t.note.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchCat = selectedCat === 'All' || t.category === selectedCat;
          const matchPay = selectedPayment === 'All' || t.paymentMethod === selectedPayment;
          return matchQuery && matchCat && matchPay;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery, selectedCat, selectedPayment]);

      const handleTestAndSaveFirebase = async () => {
        if (!firebaseConfig.trim()) {
          if (FirebaseService.unsubscribe) FirebaseService.unsubscribe();
          FirebaseService.db = null;
          localStorage.removeItem('pocket_inr_fb');
          setFbStatus({ connected: false, message: 'Firebase configuration cleared.', type: 'info' });
          loadLocalTransactions();
          return;
        }

        setIsTestingFb(true);
        try {
          let parsed = JSON.parse(firebaseConfig.trim());
          const res = await FirebaseService.init(parsed);
          if (res.success) {
            localStorage.setItem('pocket_inr_fb', JSON.stringify(parsed));
            setFbStatus({ connected: true, message: `Connected (${res.projectId})`, projectId: res.projectId, type: 'success' });
            subscribeToFirestore();
          } else {
            setFbStatus({ connected: false, message: `Connection Failed: ${res.error}`, type: 'error' });
          }
        } catch (err) {
          setFbStatus({ connected: false, message: `Invalid config format: ${err.message}`, type: 'error' });
        } finally {
          setIsTestingFb(false);
        }
      };

      const handleSaveTransaction = async (e) => {
        e.preventDefault();
        if (!formData.title || !formData.amount || isNaN(formData.amount)) return;

        const expensePayload = {
          id: editingTx ? editingTx.id : `local_${Date.now()}`,
          title: formData.title.trim(),
          amount: parseFloat(formData.amount),
          type: formData.type,
          category: formData.category,
          date: formData.date,
          paymentMethod: formData.paymentMethod,
          note: formData.note
        };

        if (fbStatus.connected && FirebaseService.db) {
          try {
            await FirebaseService.saveExpense(expensePayload);
          } catch (err) {
            updateLocalStorageWithItem(expensePayload);
          }
        } else {
          updateLocalStorageWithItem(expensePayload);
        }

        setIsAddModalOpen(false);
        setEditingTx(null);
        resetForm();
      };

      const updateLocalStorageWithItem = (item) => {
        let updated = editingTx 
          ? transactions.map(t => t.id === item.id ? item : t) 
          : [item, ...transactions];
        saveLocalTransactions(updated);
      };

      const handleDelete = async (id) => {
        if (fbStatus.connected && FirebaseService.db && !id.startsWith('local_')) {
          try { await FirebaseService.deleteExpense(id); } catch (err) {}
        } else {
          const updated = transactions.filter(t => t.id !== id);
          saveLocalTransactions(updated);
        }
      };

      const resetForm = () => {
        setFormData({
          title: '',
          amount: '',
          type: 'expense',
          category: EXPENSE_CATEGORIES[0].id,
          date: new Date().toISOString().split('T')[0],
          paymentMethod: 'UPI',
          note: ''
        });
      };

      const handleTypeChange = (newType) => {
        const defaultCat = newType === 'income' ? INCOME_CATEGORIES[0].id : EXPENSE_CATEGORIES[0].id;
        setFormData(prev => ({
          ...prev,
          type: newType,
          category: defaultCat
        }));
      };

      const handleEdit = (tx) => {
        setEditingTx(tx);
        setFormData({
          title: tx.title,
          amount: tx.amount.toString(),
          type: tx.type || 'expense',
          category: tx.category,
          date: tx.date,
          paymentMethod: tx.paymentMethod || 'UPI',
          note: tx.note || ''
        });
        setIsAddModalOpen(true);
      };

      const handleExportCSV = () => {
        const headers = ['ID', 'Title', 'Amount (INR)', 'Type', 'Category', 'Payment Method', 'Date', 'Note'];
        const rows = transactions.map(t => [
          t.id, 
          `"${t.title.replace(/"/g, '""')}"`, 
          t.amount, 
          t.type || 'expense', 
          t.category, 
          t.paymentMethod || 'UPI', 
          t.date, 
          `"${(t.note || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `Transactions_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Chart Rendering Logic
      useEffect(() => {
        if (activeTab !== 'analytics' || typeof window.Chart === 'undefined') return;

        const targetCategories = analyticsType === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
        const textColor = theme === 'dark' ? '#94a3b8' : '#475569';
        const gridColor = theme === 'dark' ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.06)';

        // Doughnut Chart
        if (categoryChartRef.current) {
          const ctx = categoryChartRef.current.getContext('2d');
          if (categoryChartInstance.current) categoryChartInstance.current.destroy();

          const catTotals = {};
          targetCategories.forEach(c => { catTotals[c.id] = 0; });
          analyticsFilteredTransactions.forEach(t => { catTotals[t.category] = (catTotals[t.category] || 0) + Number(t.amount); });

          const activeCats = targetCategories.filter(c => catTotals[c.id] > 0);
          const labels = activeCats.length ? activeCats.map(c => c.label) : ['No Data'];
          const data = activeCats.length ? activeCats.map(c => catTotals[c.id]) : [1];
          const colors = activeCats.length ? activeCats.map(c => c.color) : ['#334155'];

          categoryChartInstance.current = new window.Chart(ctx, {
            type: 'doughnut',
            data: {
              labels,
              datasets: [{ data, backgroundColor: colors, borderWidth: 0 }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: textColor, font: { size: 10 } } }
              },
              cutout: '68%'
            }
          });
        }

        // Trend Chart
        if (trendChartRef.current) {
          const ctx = trendChartRef.current.getContext('2d');
          if (trendChartInstance.current) trendChartInstance.current.destroy();

          const trendMap = {};
          const sorted = [...analyticsFilteredTransactions].sort((a, b) => new Date(a.date) - new Date(b.date));
          sorted.forEach(t => { trendMap[t.date] = (trendMap[t.date] || 0) + Number(t.amount); });

          const barColor = analyticsType === 'income' ? 'rgba(16, 185, 129, 0.75)' : 'rgba(244, 63, 94, 0.75)';

          trendChartInstance.current = new window.Chart(ctx, {
            type: 'bar',
            data: {
              labels: Object.keys(trendMap).length ? Object.keys(trendMap) : ['No Data'],
              datasets: [{
                label: analyticsType === 'income' ? 'Income (₹)' : 'Spending (₹)',
                data: Object.values(trendMap).length ? Object.values(trendMap) : [0],
                backgroundColor: barColor,
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
              }
            }
          });
        }

        // Payment Chart
        if (paymentChartRef.current) {
          const ctx = paymentChartRef.current.getContext('2d');
          if (paymentChartInstance.current) paymentChartInstance.current.destroy();

          const payTotals = {};
          PAYMENT_METHODS.forEach(m => { payTotals[m] = 0; });
          analyticsFilteredTransactions.forEach(t => {
            const mode = t.paymentMethod || 'UPI';
            payTotals[mode] = (payTotals[mode] || 0) + Number(t.amount);
          });

          const activeModes = PAYMENT_METHODS.filter(m => payTotals[m] > 0);
          const labels = activeModes.length ? activeModes : ['No Data'];
          const data = activeModes.length ? activeModes.map(m => payTotals[m]) : [1];
          const colors = ['#10b981', '#3b82f6', '#f59e0b', '#a855f7', '#06b6d4', '#ec4899', '#6366f1'];

          paymentChartInstance.current = new window.Chart(ctx, {
            type: 'pie',
            data: {
              labels,
              datasets: [{
                data,
                backgroundColor: colors.slice(0, labels.length),
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'right', labels: { color: textColor, font: { size: 10 } } } }
            }
          });
        }

        return () => {
          if (categoryChartInstance.current) categoryChartInstance.current.destroy();
          if (trendChartInstance.current) trendChartInstance.current.destroy();
          if (paymentChartInstance.current) paymentChartInstance.current.destroy();
        };
      }, [analyticsFilteredTransactions, activeTab, analyticsTimeframe, analyticsType, theme]);

      const isDark = theme === 'dark';

      return (
        <div className={`theme-${theme} h-full w-full max-w-md mx-auto flex flex-col relative overflow-hidden border-x ${
          isDark ? 'bg-slate-950 text-slate-100 border-slate-800/80' : 'bg-slate-50 text-slate-800 border-slate-200'
        }`}>
          
          <header className="clay-header sticky top-0 z-30 px-5 py-4 flex items-center justify-between shrink-0">
            <div className="inline-flex items-center gap-2.5">
              <div className="w-10 h-10 clay-pill bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 inline-flex items-center justify-center font-bold">
                <Icons.Rupee className="w-5 h-5 stroke-[2.5]" />
              </div>
              <div>
                <h1 className={`text-base font-bold leading-none ${isDark ? 'text-white' : 'text-slate-900'}`}>PocketTrack</h1>
                <div className="inline-flex items-center gap-1.5 mt-0.5">
                  <span className={`w-2 h-2 rounded-full ${fbStatus.connected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className={`text-[11px] font-medium ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                    {fbStatus.connected ? 'Firestore Live' : 'Local Storage'}
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button 
                onClick={toggleTheme}
                className={`p-2.5 clay-btn active:scale-95 transition-all inline-flex items-center justify-center ${
                  isDark ? 'text-amber-400' : 'text-slate-700'
                }`}
                title={`Switch to ${isDark ? 'Light' : 'Dark'} Mode`}
              >
                {isDark ? <Icons.Sun className="w-4 h-4" /> : <Icons.Moon className="w-4 h-4" />}
              </button>

              <button 
                onClick={handleExportCSV}
                className={`p-2.5 clay-btn active:scale-95 transition-all inline-flex items-center justify-center ${
                  isDark ? 'text-slate-300' : 'text-slate-700'
                }`}
                title="Export CSV Report"
              >
                <Icons.Download className="w-4 h-4" />
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto no-scrollbar px-4 py-5 space-y-5 pb-28">

            {/* TAB 1: HOME */}
            {activeTab === 'home' && (
              <div className="space-y-5 animate-slide-up">
                
                <div className="clay-card-emerald p-5 shadow-xl relative overflow-hidden">
                  <div className="flex justify-between items-start">

                      type="number"
                      value={monthlyBudget}
                      onChange={(e) => setMonthlyBudget(Number(e.target.value))}
                      className={`w-full pl-8 pr-3 py-2 border rounded-xl text-xs font-bold focus:outline-none ${
                        isDark ? 'bg-slate-900 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                      }`}
                    />
                  </div>
                </div>

              </div>
            )}

          </main>

          <button 
            onClick={() => { resetForm(); setIsAddModalOpen(true); }}
            className="fixed bottom-20 right-6 z-40 w-14 h-14 clay-btn-primary text-slate-950 rounded-full flex items-center justify-center touch-press"
          >
            <Icons.Plus className="w-7 h-7 stroke-[2.5]" />
          </button>

          <nav className="clay-nav fixed bottom-0 left-0 right-0 max-w-md mx-auto z-30 px-4 py-2 flex justify-around items-center">
            <button 
              onClick={() => setActiveTab('home')}
              className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'home' ? 'text-emerald-500 font-bold' : isDark ? 'text-slate-400' : 'text-slate-500'}`}
            >
              <Icons.HomeNav className="w-5 h-5" />
              <span className="text-[10px]">Home</span>
            </button>

            <button 
              onClick={() => setActiveTab('analytics')}
              className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'analytics' ? 'text-emerald-500 font-bold' : isDark ? 'text-slate-400' : 'text-slate-500'}`}
            >
              <Icons.BarChart3 className="w-5 h-5" />
              <span className="text-[10px]">Analytics</span>
            </button>

            <button 
              onClick={() => setActiveTab('transactions')}
              className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'transactions' ? 'text-emerald-500 font-bold' : isDark ? 'text-slate-400' : 'text-slate-500'}`}
            >
              <Icons.Receipt className="w-5 h-5" />
              <span className="text-[10px]">History</span>
            </button>

            <button 
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'settings' ? 'text-emerald-500 font-bold' : isDark ? 'text-slate-400' : 'text-slate-500'}`}
            >
              <Icons.Settings className="w-5 h-5" />
              <span className="text-[10px]">Sync</span>
            </button>
          </nav>

          {isAddModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end justify-center p-0">
              <div className={`w-full max-w-md border-t rounded-t-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto animate-slide-up ${
                isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
              }`}>
                <div className={`flex justify-between items-center border-b pb-3 ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                  <h3 className={`text-sm font-bold ${isDark ? 'text-white' : 'text-slate-900'}`}>
                    {editingTx ? 'Edit Transaction' : 'Add New Transaction'}
                  </h3>
                  <button onClick={() => setIsAddModalOpen(false)} className={`p-1 ${isDark ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-900'}`}>
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTransaction} className="space-y-3.5">
                  <div className={`grid grid-cols-2 gap-2 p-1 rounded-xl border ${isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-100 border-slate-300'}`}>
                    <button
                      type="button"
                      onClick={() => handleTypeChange('expense')}
                      className={`py-2 text-xs font-bold rounded-lg transition-all ${
                        formData.type === 'expense' ? 'bg-rose-500 text-white' : 'text-slate-400'
                      }`}
                    >
                      Expense
                    </button>
                    <button
                      type="button"
                      onClick={() => handleTypeChange('income')}
                      className={`py-2 text-xs font-bold rounded-lg transition-all ${
                        formData.type === 'income' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'
                      }`}
                    >
                      Income
                    </button>
                  </div>

                  <div>
                    <label className={`block text-[11px] font-bold mb-1 uppercase ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Title</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Swiggy, Fuel, Salary, Mutual Fund"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className={`w-full border rounded-xl px-3 py-2.5 text-xs focus:outline-none ${
                        isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                      }`}
                    />
                  </div>

                  <div>
                    <label className={`block text-[11px] font-bold mb-1 uppercase ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Amount (₹ INR)</label>
                    <input 
                      type="number"
                      step="0.01"
                      required
                      placeholder="0.00"
                      value={formData.amount}
                      onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                      className={`w-full border rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none ${
                        isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                      }`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className={`block text-[11px] font-bold mb-1 uppercase ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Category</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className={`w-full border rounded-xl px-2.5 py-2.5 text-xs focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                        }`}
                      >
                        {(formData.type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map(c => (
                          <option key={c.id} value={c.id}>{c.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className={`block text-[11px] font-bold mb-1 uppercase ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Payment Method</label>
                      <select
                        value={formData.paymentMethod}
                        onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}
                        className={`w-full border rounded-xl px-2.5 py-2.5 text-xs focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                        }`}
                      >
                        {PAYMENT_METHODS.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className={`block text-[11px] font-bold mb-1 uppercase ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Date</label>
                    <input 
                      type="date"
                      required
                      value={formData.date}
                      onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                      className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none ${
                        isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                      }`}
                    />
                  </div>

                  <div>
                    <label className={`block text-[11px] font-bold mb-1 uppercase ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Notes (Optional)</label>
                    <textarea 
                      rows="2"
                      placeholder="Add details..."
                      value={formData.note}
                      onChange={(e) => setFormData({ ...formData, note: e.target.value })}
                      className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none ${
                        isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'
                      }`}
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 clay-btn-primary font-bold rounded-xl text-xs transition-all"
                  >
                    {editingTx ? 'Update Transaction' : 'Save Transaction'}
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
